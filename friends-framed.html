<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Framed — Guess the Episode in 6 Frames</title>
    <meta name="description" content="Can you name the Friends episode from a single still? Six frames ordered from hardest deep-cut shot to iconic giveaway.">
    <link rel="icon" type="image/svg+xml" href="img/friends-framed.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #0e0c0a;
            --bg-gradient: radial-gradient(circle at 50% 26%, #1d1610 0%, #0e0c0a 72%);
            --surface: #181512;
            --surface-2: #221d18;
            --surface-hover: #2d261f;
            --border: rgba(255, 244, 228, 0.1);
            --border-strong: rgba(255, 244, 228, 0.2);
            --text: #f5f0e8;
            --text-muted: #a39889;
            --text-dim: #665e54;
            --accent: #e2a829;
            --accent-hover: #f0b83c;
            --accent-ink: #17130d;
            --dot-red: #d9483b;
            --dot-blue: #2f88c4;
            --dot-yellow: #e2a829;
            --miss: #b83a3a;
            --miss-bg: rgba(184, 58, 58, 0.15);
            --miss-border: rgba(184, 58, 58, 0.36);
            --miss-text: #e6c6c6;
            --skip-bg: rgba(255, 255, 255, 0.04);
            --tab-disabled-bg: rgba(255, 255, 255, 0.025);
            --tab-disabled-border: rgba(255, 255, 255, 0.05);
            --code-badge-bg: rgba(255, 244, 228, 0.08);
            --won-bg: rgba(46, 155, 88, 0.2);
            --won-border: rgba(46, 155, 88, 0.55);
            --won-text: #9be7b8;
            --lost-bg: rgba(184, 58, 58, 0.2);
            --lost-border: rgba(184, 58, 58, 0.55);
            --lost-text: #f0a3a3;
            --stage-shadow: 0 22px 54px rgba(0, 0, 0, 0.62);
            --popover-shadow: 0 18px 40px rgba(0, 0, 0, 0.68);
            --ac-shadow: 0 -14px 36px rgba(0, 0, 0, 0.76);
            --win: #2e9b58;
            --radius: 8px;
        }

        [data-theme="light"] {
            --bg: #f4f1ea;
            --bg-gradient: radial-gradient(circle at 50% 24%, #fbf9f5 0%, #ede8de 80%);
            --surface: #ffffff;
            --surface-2: #f7f4ee;
            --surface-hover: #eae4d9;
            --border: rgba(28, 24, 20, 0.12);
            --border-strong: rgba(28, 24, 20, 0.24);
            --text: #1c1814;
            --text-muted: #655c51;
            --text-dim: #9a9083;
            --accent: #dca01d;
            --accent-hover: #c98f12;
            --accent-ink: #17130d;
            --dot-red: #d43f31;
            --dot-blue: #2376b0;
            --dot-yellow: #dca01d;
            --miss: #c03535;
            --miss-bg: rgba(192, 53, 53, 0.09);
            --miss-border: rgba(192, 53, 53, 0.3);
            --miss-text: #842323;
            --skip-bg: rgba(28, 24, 20, 0.045);
            --tab-disabled-bg: rgba(28, 24, 20, 0.035);
            --tab-disabled-border: rgba(28, 24, 20, 0.08);
            --code-badge-bg: rgba(28, 24, 20, 0.07);
            --won-bg: rgba(36, 143, 77, 0.14);
            --won-border: rgba(36, 143, 77, 0.48);
            --won-text: #186636;
            --lost-bg: rgba(192, 53, 53, 0.12);
            --lost-border: rgba(192, 53, 53, 0.45);
            --lost-text: #8c2323;
            --stage-shadow: 0 18px 42px rgba(28, 24, 20, 0.16);
            --popover-shadow: 0 16px 36px rgba(28, 24, 20, 0.18);
            --ac-shadow: 0 -12px 32px rgba(28, 24, 20, 0.16);
            --win: #248f4d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            background-image: var(--bg-gradient);
            color: var(--text);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header --- */
        header {
            width: 100%;
            max-width: 1180px;
            height: 62px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            flex-shrink: 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            color: var(--text);
            justify-self: start;
            user-select: none;
        }

        .brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .friends-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .f-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }
        .f-dot.red { background: var(--dot-red); }
        .f-dot.blue { background: var(--dot-blue); }
        .f-dot.yellow { background: var(--dot-yellow); }

        .stats-bar {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .stats-bar strong {
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        .stats-sep {
            width: 1px;
            height: 12px;
            background: var(--border-strong);
        }

        .round-nav {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .nav-arrow,
        .theme-toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle-btn {
            margin-left: 4px;
        }

        .theme-toggle-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-arrow:hover:not(:disabled),
        .theme-toggle-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .round-picker-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            min-width: 76px;
        }

        .round-picker-btn:hover {
            background: var(--surface-hover);
        }

        /* Round Picker Popover */
        .round-popover {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 272px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 12px;
            box-shadow: var(--popover-shadow);
            z-index: 500;
        }

        .round-popover.open {
            display: block;
        }

        .round-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-height: 264px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .round-cell {
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .round-cell:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .round-cell.current {
            border-color: var(--accent);
            color: var(--text);
        }

        .round-cell.won {
            background: var(--won-bg);
            border-color: var(--won-border);
            color: var(--won-text);
        }

        .round-cell.lost {
            background: var(--lost-bg);
            border-color: var(--lost-border);
            color: var(--lost-text);
        }

        .popover-footer {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popover-score {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            padding: 2px 4px;
        }

        .reset-btn:hover {
            color: var(--miss);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            width: 100%;
            max-width: 1180px;
            padding: 4px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            min-height: 0;
        }

        .frame-stage {
            position: relative;
            width: min(92vw, 1060px, calc((100vh - 245px) * 16 / 9));
            aspect-ratio: 16 / 9;
            background: #060504;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--stage-shadow);
        }

        #frame-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.14s ease;
        }

        #frame-image.loading {
            opacity: 0.25;
        }

        /* --- Frame Tabs [1..6] --- */
        .frame-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .frame-tab {
            width: 42px;
            height: 38px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .frame-tab:hover:not(:disabled) {
            background: var(--surface-hover);
        }

        .frame-tab.missed {
            background: var(--miss-bg);
            border-color: var(--miss-border);
            color: var(--miss-text);
        }

        .frame-tab.solved {
            background: var(--win);
            border-color: var(--win);
            color: #fff;
        }

        .frame-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
            transform: translateY(-1px);
        }

        .frame-tab.solved.active {
            background: var(--win);
            border-color: #7be0a0;
            color: #fff;
        }

        .frame-tab:disabled {
            background: var(--tab-disabled-bg);
            border-color: var(--tab-disabled-border);
            color: var(--text-dim);
            cursor: default;
        }

        /* --- Controls / Reveal Area --- */
        .interaction-area {
            width: min(92vw, 720px);
            min-height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .guess-bar {
            width: 100%;
            display: flex;
            gap: 8px;
            position: relative;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        #guess-input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.98rem;
            outline: none;
        }

        #guess-input::placeholder {
            color: var(--text-dim);
        }

        #guess-input:focus {
            border-color: var(--accent);
            background: var(--surface-2);
        }

        .action-btn {
            height: 46px;
            padding: 0 20px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
            white-space: nowrap;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-skip {
            background: var(--surface-2);
            border-color: var(--border);
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-skip:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* Autocomplete pops UPWARD so it never clips off bottom */
        .autocomplete {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            box-shadow: var(--ac-shadow);
            max-height: 300px;
            overflow-y: auto;
            z-index: 400;
        }

        .autocomplete.open {
            display: block;
        }

        .ac-item {
            padding: 10px 14px;
            font-size: 0.94rem;
            color: var(--text);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ac-item:last-child {
            border-bottom: none;
        }

        .ac-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--code-badge-bg);
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 56px;
            text-align: center;
        }

        .ac-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ac-item:hover,
        .ac-item.highlighted {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .ac-item:hover .ac-code,
        .ac-item.highlighted .ac-code {
            background: rgba(23, 19, 13, 0.16);
            color: var(--accent-ink);
        }

        /* Wrong-guess trail */
        .guess-trail {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 30px;
        }

        .guess-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 5px;
            background: var(--miss-bg);
            border: 1px solid var(--miss-border);
            color: var(--miss-text);
            font-size: 0.81rem;
            max-width: 300px;
        }

        .guess-chip.skipped {
            background: var(--skip-bg);
            border-color: var(--border);
            color: var(--text-muted);
        }

        .guess-chip .mark {
            color: var(--miss);
            font-weight: 700;
            flex-shrink: 0;
        }

        .guess-chip.skipped .mark {
            color: var(--text-dim);
        }

        .guess-chip .chip-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Reveal Banner */
        .reveal-box {
            display: none;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border-strong);
        }

        .reveal-box.won {
            border-color: var(--won-border);
            background: var(--won-bg);
        }

        .reveal-box.lost {
            border-color: var(--lost-border);
            background: var(--lost-bg);
        }

        .reveal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .reveal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reveal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 720px) {
            header {
                height: auto;
                padding: 12px 14px;
                grid-template-columns: 1fr auto;
                row-gap: 8px;
            }
            .stats-bar {
                display: none;
            }
            .frame-stage {
                width: 94vw;
            }
            .frame-tab {
                width: 38px;
                height: 36px;
            }
            .action-btn {
                padding: 0 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>
                <span>FRIENDS</span>
                <span class="friends-dots" aria-hidden="true">
                    <span class="f-dot red"></span>
                    <span class="f-dot blue"></span>
                    <span class="f-dot yellow"></span>
                </span>
                <span>FRAMED</span>
            </h1>
        </div>

        <div class="stats-bar" id="header-stats">
            <span>Solved <strong id="stat-solved">0 / 20</strong></span>
            <span class="stats-sep"></span>
            <span>Avg Frame <strong id="stat-avg">—</strong></span>
        </div>

        <div class="round-nav">
            <button id="prev-round-btn" class="nav-arrow" type="button" aria-label="Previous episode">‹</button>
            <button id="round-picker-toggle" class="round-picker-btn" type="button">1 / 20</button>
            <button id="next-round-btn" class="nav-arrow" type="button" aria-label="Next episode">›</button>
            <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" title="Toggle light / dark mode" aria-label="Toggle light / dark mode"></button>

            <div id="round-popover" class="round-popover">
                <div id="round-grid" class="round-grid"></div>
                <div class="popover-footer">
                    <span id="popover-score" class="popover-score">0 / 20 solved</span>
                    <button id="reset-btn" class="reset-btn" type="button">Reset</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="frame-stage">
            <img id="frame-image" alt="Mystery Friends episode frame" draggable="false">
        </div>

        <div id="frame-tabs" class="frame-tabs" role="tablist" aria-label="Frames"></div>

        <div class="interaction-area">
            <div id="guess-bar" class="guess-bar">
                <div class="search-wrap">
                    <div id="autocomplete" class="autocomplete" role="listbox"></div>
                    <input id="guess-input" type="text" placeholder="Search episode title or season (e.g. 'embryos', 'armadillo', 's4')..." autocomplete="off" spellcheck="false">
                </div>
                <button id="submit-btn" class="action-btn btn-submit" type="button">Submit</button>
                <button id="skip-btn" class="action-btn btn-skip" type="button">Skip</button>
            </div>

            <div id="reveal-box" class="reveal-box">
                <div class="reveal-info">
                    <div id="reveal-title" class="reveal-title"></div>
                    <div id="reveal-sub" class="reveal-sub"></div>
                </div>
                <button id="reveal-next-btn" class="action-btn btn-submit" type="button">Next →</button>
            </div>

            <div id="guess-trail" class="guess-trail"></div>
        </div>

    <script>
        const STORAGE_KEY = 'friends_framed_proto_v1';
        const SUN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/></svg>';

        const state = {

            acHighlight: -1,

        function decodeB64(str) {
            if (!str) return '';
            const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function normText(s) {
            return (s || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function stripTheOnePrefix(normStr) {
            return normStr
                .replace(/^the one (with the |with a |with an |with |where the |where |after the |after |in the |in |at the |at |that |on the )/, '')
                .replace(/^the /, '')
                .trim();
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.innerHTML = state.theme === 'dark' ? SUN_ICON : MOON_ICON;
            }
        }

        function loadSaved() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.theme === 'light' || parsed.theme === 'dark') state.theme = parsed.theme;
                if (typeof parsed.index === 'number') state.index = parsed.index;
                if (parsed.progress) state.progress = parsed.progress;
            } catch (_) {}
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    theme: state.theme,
                    index: state.index,
                    progress: state.progress
                }));
            } catch (_) {}
        }

        function puzzleList() {
            return state.data ? state.data.puzzles : [];
        }

        function catalogList() {
            return state.data ? state.data.episodes : [];
        }

        function currentPuzzle() {
            const list = puzzleList();
            if (!list.length) return null;
            const idx = Math.max(0, Math.min(state.index || 0, list.length - 1));
            state.index = idx;
            return list[idx];
        }

        function getPuzzleCode(puzzle) {
            const raw = decodeB64(puzzle.c); // "4:12"
            const [s, e] = raw.split(':').map(Number);
            return { s, e };
        }

        function getPuzzleState(puzzle) {
            if (!state.progress[puzzle.id]) {
                state.progress[puzzle.id] = { guesses: [], status: 'playing' };
            }
            return state.progress[puzzle.id];
        }

        function maxUnlockedFrame(pState) {
            if (pState.status !== 'playing') return 5;
            return Math.min(5, pState.guesses.length);
        }

        function preloadFrames(puzzle, upTo) {
            const limit = Math.min(5, upTo + 1);
            for (let i = 0; i <= limit; i++) {
                const img = new Image();
                img.src = puzzle.frames[i];
            }
        }

        function setDisplayedFrame(frameIdx) {
            const puzzle = currentPuzzle();
            if (!puzzle) return;
            state.activeFrame = frameIdx;
            const imgEl = document.getElementById('frame-image');
            const nextSrc = puzzle.frames[frameIdx];
            if (imgEl.dataset.src !== nextSrc) {
                imgEl.classList.add('loading');
                imgEl.onload = () => imgEl.classList.remove('loading');
                imgEl.onerror = () => imgEl.classList.remove('loading');
                imgEl.dataset.src = nextSrc;
                imgEl.src = nextSrc;
            }
            renderTabs();
        }

        function renderTabs() {
            const puzzle = currentPuzzle();
            const pState = getPuzzleState(puzzle);
            const maxUnlocked = maxUnlockedFrame(pState);
            const tabsEl = document.getElementById('frame-tabs');
            tabsEl.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'frame-tab';
                btn.textContent = String(i + 1);
                btn.disabled = i > maxUnlocked;

                if (pState.status === 'won' && i === pState.guesses.length - 1) {
                    btn.classList.add('solved');
                } else if (i < pState.guesses.length) {
                    btn.classList.add('missed');
                }

                if (i === state.activeFrame) {
                    btn.classList.add('active');
                }

                btn.addEventListener('click', () => setDisplayedFrame(i));
                tabsEl.appendChild(btn);
            }
        }

        function renderPopoverAndStats() {
            const list = puzzleList();
            const grid = document.getElementById('round-grid');
            grid.innerHTML = '';

            let wonCount = 0;
            let totalFramesOnWins = 0;

            list.forEach((p, i) => {
                const ps = state.progress[p.id];
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'round-cell';
                cell.textContent = String(i + 1);
                if (i === state.index) cell.classList.add('current');
                if (ps && ps.status === 'won') {
                    cell.classList.add('won');
                    wonCount++;
                    totalFramesOnWins += ps.guesses.length;
                } else if (ps && ps.status === 'lost') {
                    cell.classList.add('lost');
                }
                cell.addEventListener('click', () => {
                    goToRound(i);
                    closePopover();
                });
                grid.appendChild(cell);
            });

            document.getElementById('popover-score').textContent = `${wonCount} / ${list.length} solved`;
            document.getElementById('stat-solved').textContent = `${wonCount} / ${list.length}`;
            document.getElementById('stat-avg').textContent = wonCount > 0
                ? (totalFramesOnWins / wonCount).toFixed(1)
                : '—';
        }

        function render() {
            const list = puzzleList();
            const puzzle = currentPuzzle();
            if (!puzzle) return;

            const idx = state.index;
            const pState = getPuzzleState(puzzle);
            const target = getPuzzleCode(puzzle);

            document.getElementById('round-picker-toggle').textContent = `${idx + 1} / ${list.length}`;
            document.getElementById('prev-round-btn').disabled = idx === 0;
            document.getElementById('next-round-btn').disabled = idx === list.length - 1;

            const guessBar = document.getElementById('guess-bar');
            const revealBox = document.getElementById('reveal-box');

            if (pState.status === 'playing') {
                guessBar.style.display = 'flex';
                revealBox.style.display = 'none';
            } else {
                guessBar.style.display = 'none';
                revealBox.style.display = 'flex';
                revealBox.className = `reveal-box ${pState.status}`;
                document.getElementById('reveal-title').textContent = decodeB64(puzzle.a);
                const subText = decodeB64(puzzle.s);
                const solvedNote = pState.status === 'won'
                    ? ` · Solved on Frame ${pState.guesses.length}`
                    : '';
                document.getElementById('reveal-sub').textContent = subText + solvedNote;
                const nextBtn = document.getElementById('reveal-next-btn');
                nextBtn.style.display = idx < list.length - 1 ? 'inline-block' : 'none';
            }

            // Render wrong-guess chips
            const trail = document.getElementById('guess-trail');
            trail.innerHTML = '';
            const wrongList = pState.status === 'won'
                ? pState.guesses.slice(0, -1)
                : pState.guesses;

            wrongList.forEach(g => {
                const entry = typeof g === 'string' ? { text: g, skip: g === 'Skipped' } : g;
                const chip = document.createElement('div');
                chip.className = 'guess-chip' + (entry.skip ? ' skipped' : '');

                const mark = document.createElement('span');
                mark.className = 'mark';
                mark.textContent = entry.skip ? '↷' : '✕';
                chip.appendChild(mark);

                const label = document.createElement('span');
                label.className = 'chip-label';
                label.textContent = entry.text;
                chip.appendChild(label);

                trail.appendChild(chip);
            });

            const maxFrame = maxUnlockedFrame(pState);
            preloadFrames(puzzle, maxFrame);
            const targetFrame = pState.status === 'won'
                ? Math.max(0, pState.guesses.length - 1)
                : Math.min(5, pState.guesses.length);
            setDisplayedFrame(pState.status === 'lost' ? state.activeFrame : targetFrame);

            renderPopoverAndStats();
        }

        function resolveCatalogEpisode(rawText) {
            const q = normText(rawText);
            if (!q) return null;
            for (const ep of catalogList()) {
                const full = normText(`${ep.code} ${ep.title}`);
                const titleOnly = normText(ep.title);
                const stripped = stripTheOnePrefix(titleOnly);
                if (q === full || q === titleOnly || (stripped && q === stripped)) {
                    return ep;
                }
            }
            return null;
        }

        function isCorrectEpisode(epObj, rawText, puzzle) {
            const target = getPuzzleCode(puzzle);
            if (epObj && epObj.s === target.s && epObj.e === target.e) {
                return true;
            }
            // Also accept Part 1 / Part 2 sibling or alternate title if marked in puzzle.al
            const valid = [decodeB64(puzzle.a), ...(puzzle.al || []).map(decodeB64)].map(normText);
            if (epObj && valid.includes(normText(epObj.title))) {
                return true;
            }
            const ng = normText(rawText);
            return Boolean(ng) && valid.includes(ng);
        }

        function formatEpDisplay(ep) {
            return `${ep.code} · ${ep.title}`;
        }

        function submitGuess(isSkip = false) {
            const puzzle = currentPuzzle();
            if (!puzzle) return;
            const pState = getPuzzleState(puzzle);
            if (pState.status !== 'playing') return;

            const input = document.getElementById('guess-input');
            let rawVal = isSkip ? '' : input.value.trim();
            let chosenEp = isSkip ? null : state.selectedEp;

            if (!isSkip && !chosenEp && state.acHighlight >= 0 && state.acMatches[state.acHighlight]) {
                chosenEp = state.acMatches[state.acHighlight];
                rawVal = formatEpDisplay(chosenEp);
            } else if (!isSkip && !chosenEp && rawVal) {
                chosenEp = resolveCatalogEpisode(rawVal);
            }

            closeAutocomplete();
            input.value = '';
            state.selectedEp = null;

            if (!rawVal && !isSkip) {
                isSkip = true;
            }

            if (!isSkip && isCorrectEpisode(chosenEp, rawVal, puzzle)) {
                pState.guesses.push({
                    text: decodeB64(puzzle.a),
                    s: chosenEp ? chosenEp.s : undefined,
                    e: chosenEp ? chosenEp.e : undefined
                });
                pState.status = 'won';
            } else if (isSkip) {
                pState.guesses.push({ text: 'Skipped', skip: true });
                if (pState.guesses.length >= 6) {
                    pState.status = 'lost';
                    state.activeFrame = 5;
                }
            } else {
                pState.guesses.push({
                    text: chosenEp ? chosenEp.title : rawVal,
                    s: chosenEp ? chosenEp.s : undefined,
                    e: chosenEp ? chosenEp.e : undefined
                });
                if (pState.guesses.length >= 6) {
                    pState.status = 'lost';
                    state.activeFrame = 5;
                }
            }

            saveState();
            render();
        }

        function goToRound(newIdx) {
            const list = puzzleList();
            if (newIdx < 0 || newIdx >= list.length) return;
            state.index = newIdx;
            state.activeFrame = 0;
            state.selectedEp = null;
            closeAutocomplete();
            document.getElementById('guess-input').value = '';
            saveState();
            render();
        }

        function parseSeasonQuery(q) {
            // Matches "s4", "season 4", "s04", "s4e12", "4x12"
            let m = q.match(/^(?:s|season\s*)0*(10|[1-9])(?:\s*e0*(\d{1,2}))?$/);
            if (m) return { s: Number(m[1]), e: m[2] ? Number(m[2]) : null };
            m = q.match(/^0*(10|[1-9])\s*x\s*0*(\d{1,2})$/);
            if (m) return { s: Number(m[1]), e: Number(m[2]) };
            return null;
        }

        function updateAutocomplete() {
            state.selectedEp = null;
            const input = document.getElementById('guess-input');
            const box = document.getElementById('autocomplete');
            const rawTrim = input.value.trim().toLowerCase();
            const q = normText(input.value);

            if (q.length < 1) {
                closeAutocomplete();
                return;
            }

            const catalog = catalogList();
            const sq = parseSeasonQuery(rawTrim);

            if (sq) {
                const seasonMatches = catalog.filter(ep => ep.s === sq.s && (sq.e === null || ep.e === sq.e));
                state.acMatches = seasonMatches.slice(0, 26);
            } else {
                const hookStarts = [];
                const hookWordStarts = [];
                const titleStarts = [];
                const contains = [];
                // Fan-nickname keyword matching (`ep.kw`, e.g. "leather pants" -> TOW All the Resolutions)
                // is kept in the JSON data in case we want to re-enable it later, but disabled for now:
                // const kwMatches = [];

                for (const ep of catalog) {
                    const nt = normText(ep.title);
                    const hook = stripTheOnePrefix(nt);
                    const fullCode = normText(`${ep.code} ${ep.title}`);
                    // const kws = (ep.kw || []).map(normText);

                    if (hook.startsWith(q)) {
                        hookStarts.push(ep);
                    } else if (hook.includes(' ' + q)) {
                        hookWordStarts.push(ep);
                    } else if (nt.startsWith(q) || fullCode.startsWith(q)) {
                        titleStarts.push(ep);
                    } else if (nt.includes(q) || fullCode.includes(q)) {
                        contains.push(ep);
                    }
                    // else if (kws.some(k => k.includes(q))) {
                    //     kwMatches.push(ep);
                    // }
                }

                state.acMatches = [...hookStarts, ...hookWordStarts, ...titleStarts, ...contains].slice(0, 10);
            }

            state.acHighlight = state.acMatches.length > 0 ? 0 : -1;

            if (state.acMatches.length === 0) {
                closeAutocomplete();
                return;
            }

            box.innerHTML = '';
            state.acMatches.forEach((ep, i) => {
                const item = document.createElement('div');
                item.className = 'ac-item' + (i === state.acHighlight ? ' highlighted' : '');

                const codeSpan = document.createElement('span');
                codeSpan.className = 'ac-code';
                codeSpan.textContent = ep.code;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'ac-title';
                titleSpan.textContent = ep.title;

                item.appendChild(codeSpan);
                item.appendChild(titleSpan);

                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    state.selectedEp = ep;
                    input.value = formatEpDisplay(ep);
                    closeAutocomplete();
                    input.focus();
                });
                box.appendChild(item);
            });
            box.classList.add('open');
        }

        function refreshAcHighlight() {
            const items = document.querySelectorAll('#autocomplete .ac-item');
            items.forEach((el, i) => {
                el.classList.toggle('highlighted', i === state.acHighlight);
                if (i === state.acHighlight) {
                    el.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        function closeAutocomplete() {
            state.acMatches = [];
            state.acHighlight = -1;
            const box = document.getElementById('autocomplete');
            box.classList.remove('open');
            box.innerHTML = '';
        }

        function closePopover() {
            document.getElementById('round-popover').classList.remove('open');
        }

        function bindEvents() {
            document.getElementById('prev-round-btn').addEventListener('click', () => goToRound(state.index - 1));
            document.getElementById('next-round-btn').addEventListener('click', () => goToRound(state.index + 1));
            document.getElementById('reveal-next-btn').addEventListener('click', () => goToRound(state.index + 1));

            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                applyTheme();
                saveState();
            });

            document.getElementById('round-picker-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('round-popover').classList.toggle('open');
            });

            document.getElementById('reset-btn').addEventListener('click', () => {
                state.progress = {};
                state.index = 0;
                state.activeFrame = 0;
                saveState();
                closePopover();
                render();
            });

            document.getElementById('submit-btn').addEventListener('click', () => submitGuess(false));
            document.getElementById('skip-btn').addEventListener('click', () => submitGuess(true));

            const input = document.getElementById('guess-input');
            input.addEventListener('input', updateAutocomplete);
            input.addEventListener('keydown', (e) => {
                const acOpen = document.getElementById('autocomplete').classList.contains('open');
                if (e.key === 'ArrowDown' && acOpen) {
                    e.preventDefault();
                    state.acHighlight = (state.acHighlight + 1) % state.acMatches.length;
                    refreshAcHighlight();
                } else if (e.key === 'ArrowUp' && acOpen) {
                    e.preventDefault();
                    state.acHighlight = (state.acHighlight - 1 + state.acMatches.length) % state.acMatches.length;
                    refreshAcHighlight();
                } else if (e.key === 'Tab' && acOpen && state.acHighlight >= 0) {
                    e.preventDefault();
                    const ep = state.acMatches[state.acHighlight];
                    state.selectedEp = ep;
                    input.value = formatEpDisplay(ep);
                    closeAutocomplete();
                } else if (e.key === 'Escape') {
                    closeAutocomplete();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (acOpen && state.acHighlight >= 0) {
                        const ep = state.acMatches[state.acHighlight];
                        if (normText(input.value) !== normText(formatEpDisplay(ep))) {
                            state.selectedEp = ep;
                            input.value = formatEpDisplay(ep);
                            closeAutocomplete();
                            return;
                        }
                    }
                    submitGuess(false);
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrap')) closeAutocomplete();
                if (!e.target.closest('.round-nav')) closePopover();
            });

            document.addEventListener('keydown', (e) => {
                if (document.activeElement === input) return;
                const puzzle = currentPuzzle();
                if (!puzzle) return;
                const pState = getPuzzleState(puzzle);
                const maxUnlocked = maxUnlockedFrame(pState);

                if (e.key >= '1' && e.key <= '6') {
                    const f = Number(e.key) - 1;
                    if (f <= maxUnlocked) setDisplayedFrame(f);
                } else if (e.key === 'Enter' && pState.status !== 'playing') {
                    goToRound(state.index + 1);
                } else if (e.key === 'ArrowLeft') {
                    goToRound(state.index - 1);
                } else if (e.key === 'ArrowRight') {
                    goToRound(state.index + 1);
                }
            });
        }

        async function init() {
            loadSaved();
            applyTheme();
            bindEvents();
            try {
                const res = await fetch('jsons/friends_framed.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                state.data = await res.json();
            } catch (_) {
                const embedded = document.getElementById('embedded-friends-data');
                if (embedded) {
                    state.data = JSON.parse(embedded.textContent);
                }
            }
            if (state.data) render();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
