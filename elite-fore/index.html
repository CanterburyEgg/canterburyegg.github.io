<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Fore</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #fff8f5;
            --meadow-mid: #f7dede;
            --meadow-bot: #eac0c0;
            --cream-card: #fffdf7;
            --cream-inner: #fbf2f2;
            --card-surface: #ffffff;
            --fairway: #ef4444;
            --fairway-dark: #dc2626;
            --fairway-light: #fee2e2;
            --fairway-border: #f87171;
            --sage-border: #e5c8c8;
            --sage-shadow: #d3a8a8;
            --ink: #392626;
            --ink-soft: #735f5f;
            --ink-muted: #a38a8a;
            --gold: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-bg: #fff9db;
            --gold-border: #fcd34d;
            --coral: #ef6461;
            --coral-dark: #cf4441;
            --coral-bg: #fff0f0;
            --amber-warn: #d97706;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--meadow-mid) 48%, var(--meadow-bot) 100%);
            background-attachment: fixed;
            color: var(--ink);
            display: flex;
            justify-content: center;
            padding: 28px 16px 60px;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Cute rolling meadow hills in the background */
        body::before {
            content: "";
            position: fixed;
            bottom: -30px;
            left: -5%;
            width: 110%;
            height: 220px;
            background: radial-gradient(ellipse at 25% 100%, #e2a6a6 0%, #e2a6a6 55%, transparent 56%),
                        radial-gradient(ellipse at 80% 100%, #d99494 0%, #d99494 60%, transparent 61%);
            z-index: 0;
            pointer-events: none;
        }

        #game-container {
            background-color: var(--cream-card);
            padding: 30px 32px 32px;
            border-radius: 34px;
            width: 100%;
            max-width: 980px;
            text-align: center;
            border: 3px solid var(--sage-border);
            box-shadow: 0 10px 0 var(--sage-shadow), 0 24px 48px rgba(57, 38, 38, 0.13);
            position: relative;
            z-index: 1;
        }

        /* Top Navigation Bar & Top-Left Course/Daily Menu */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 10px;
            position: relative;
            z-index: 40;
        }

        .top-left-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .club-menu-wrap {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .nav-pill-btn.active-mode {
            background: #f8e6e6;
            border-color: var(--fairway);
            box-shadow: 0 4px 0 var(--fairway);
            color: var(--fairway-dark);
        }

        .club-caret {
            font-size: 0.78rem;
            margin-left: 2px;
            transition: transform 0.18s ease;
            display: inline-block;
        }
        .club-menu-trigger.open .club-caret {
            transform: rotate(180deg);
        }

        .club-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 330px;
            max-width: calc(100vw - 44px);
            background: var(--cream-card);
            border: 3px solid var(--sage-border);
            box-shadow: 0 8px 0 var(--sage-shadow), 0 18px 38px rgba(57, 38, 38, 0.22);
            border-radius: 24px;
            padding: 14px;
            z-index: 120;
            animation: popModal 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .club-menu-section-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--ink-muted);
            padding: 4px 8px 6px;
        }

        .club-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #ffffff;
            border: 2px solid #eed7d7;
            box-shadow: 0 3px 0 #eed7d7;
            border-radius: 16px;
            padding: 9px 12px;
            margin-bottom: 7px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
        }
        .club-menu-item:last-child {
            margin-bottom: 0;
        }
        .club-menu-item:hover {
            transform: translateY(-1px);
            border-color: var(--fairway);
            background: #fdf4f4;
        }
        .club-menu-item.active {
            background: var(--fairway-light);
            border-color: var(--fairway);
            box-shadow: 0 3px 0 var(--fairway);
        }
        .club-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .club-item-icon {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: #f8e8e8;
            border: 1.5px solid #e4c1c1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .club-menu-item.active .club-item-icon {
            background: #ffffff;
            border-color: var(--fairway);
        }
        .club-item-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.15;
        }
        .club-item-sub {
            font-family: 'Nunito', sans-serif;
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--ink-soft);
        }
        .club-item-badge {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--fairway-dark);
            background: #f8e8e8;
            border: 1.5px solid #e4c1c1;
            padding: 3px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* 7-Day Daily Hole Picker inside top-left menu */
        .daily-week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 4px 0 10px;
        }
        .daily-day-btn {
            background: #ffffff;
            border: 2px solid #eed7d7;
            box-shadow: 0 2px 0 #eed7d7;
            border-radius: 11px;
            padding: 5px 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
        }
        .daily-day-btn:hover {
            transform: translateY(-1px);
            border-color: var(--fairway);
        }
        .daily-day-btn.active {
            background: var(--fairway-light);
            border-color: var(--fairway);
            box-shadow: 0 2px 0 var(--fairway);
        }
        .daily-day-btn .d-dow {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--ink);
        }
        .daily-day-btn .d-par {
            font-family: 'Nunito', sans-serif;
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--fairway-dark);
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .nav-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #ffffff;
            border: 2.5px solid var(--sage-border);
            box-shadow: 0 4px 0 var(--sage-shadow);
            color: var(--ink);
            font-family: 'Fredoka', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 7px 15px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s;
            user-select: none;
        }
        .nav-pill-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--sage-shadow);
            border-color: var(--fairway-border);
            background: #fef6f6;
        }
        .nav-pill-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--sage-shadow);
        }
        .nav-pill-btn img {
            width: 18px;
            height: 18px;
            display: block;
            filter: brightness(0.62) sepia(1) hue-rotate(-50deg) saturate(3);
        }

        /* Cute Illustrated Mascot & Flag Header */
        .hero-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
        }

        .mascot-badge {
            width: 84px;
            height: 68px;
            margin-bottom: 2px;
            filter: drop-shadow(0 4px 6px rgba(57, 38, 38, 0.1));
            animation: floatGentle 3.4s ease-in-out infinite;
        }

        @keyframes floatGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            margin: 0 0 6px 0;
            font-size: 2.55rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--ink);
            text-shadow: 0 3px 0 #edd0d0;
            line-height: 1.05;
        }

        .subtitle {
            color: var(--ink-soft);
            font-size: 0.98rem;
            font-weight: 700;
            max-width: 580px;
            margin: 0 auto;
            line-height: 1.4;
        }
        .subtitle strong {
            color: var(--fairway-dark);
            background: #f8e6e6;
            padding: 1px 8px;
            border-radius: 99px;
        }

        /* Cozy Clubhouse Scorecard Bar */
        .scorecard-bar {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--cream-inner);
            border: 2.5px solid var(--sage-border);
            box-shadow: inset 0 2px 5px rgba(57, 38, 38, 0.04);
            padding: 10px 16px;
            border-radius: 999px;
            margin-bottom: 18px;
        }

        .score-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #ffffff;
            border: 2px solid #ebd3d3;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            color: var(--ink-soft);
            font-weight: 800;
            box-shadow: 0 2px 0 #ebd3d3;
        }
        .score-pill span.val {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--ink);
        }
        .score-pill span.val.accent { color: var(--fairway); }
        .score-pill span.val.gold { color: var(--gold); }

        /* Mini 6-Cup Putting Progress Strip */
        .cup-strip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f5dfdf;
            border-radius: 999px;
            border: 2px solid #e3c3c3;
        }
        .cup-pip {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--card-surface);
            border: 2px solid #cfa5a5;
            box-shadow: 0 2px 0 #cfa5a5;
            display: inline-block;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .cup-pip::after {
            content: "";
            position: absolute;
            right: -5px;
            bottom: -5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(211, 168, 168, 0.22);
            pointer-events: none;
        }
        .cup-pip.filled {
            background: linear-gradient(180deg, #e06b6b 0%, #ae3c3c 100%);
            border-color: var(--fairway-dark);
            box-shadow: 0 2px 0 var(--fairway-dark);
            transform: scale(1.1);
        }
        .cup-pip.filled::after {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Plump Pill Input Row + Autocomplete Suggestions */
        .input-wrapper {
            position: relative;
            max-width: 580px;
            margin: 0 auto 10px;
        }

        .input-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .input-box-shell {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-paw-icon {
            position: absolute;
            left: 18px;
            font-size: 1.15rem;
            pointer-events: none;
            opacity: 0.75;
        }

        #main-input {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            padding: 14px 20px 14px 46px;
            width: 100%;
            font-size: 1.08rem;
            border-radius: 999px;
            border: 3px solid var(--sage-border);
            background: #ffffff;
            color: var(--ink);
            outline: none;
            box-shadow: 0 5px 0 #ebd3d3, inset 0 2px 4px rgba(57, 38, 38, 0.04);
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        #main-input::placeholder {
            color: var(--ink-muted);
            font-weight: 700;
        }
        #main-input:focus {
            border-color: var(--fairway);
            box-shadow: 0 5px 0 #e4b7b7, 0 0 0 4px rgba(174, 60, 60, 0.15);
        }
        #main-input:disabled {
            background: #f6eeee;
            opacity: 0.65;
            cursor: not-allowed;
        }
        #main-input.not-found,
        #main-input.not-found:focus {
            border-color: #e54848;
            background: #fff1f1;
            color: #b41818;
            box-shadow: 0 5px 0 #f5b5b5, 0 0 0 4px rgba(229, 72, 72, 0.15);
        }
        .input-box-shell.shake {
            animation: inputShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        @keyframes inputShake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-7px); }
            40%, 60% { transform: translateX(7px); }
        }

        .swing-btn {
            font-family: 'Fredoka', sans-serif;
            padding: 14px 26px;
            font-size: 1.08rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 999px;
            border: 3px solid var(--fairway-dark);
            background: linear-gradient(180deg, #d04f4f 0%, #ad3737 100%);
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            box-shadow: 0 5px 0 var(--fairway-dark);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
            white-space: nowrap;
        }
        .swing-btn:hover:not(:disabled) {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 var(--fairway-dark);
        }
        .swing-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--fairway-dark);
        }
        .swing-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* Cute Quick-Pick Suggestion Pills (Disabled) */
        .suggestions-bar {
            display: none;
        }
        .suggest-pill {
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            background: #ffffff;
            color: var(--ink);
            border: 2px solid #e5c3c3;
            box-shadow: 0 2px 0 #e5c3c3;
            padding: 4px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.1s, background 0.12s, border-color 0.12s;
        }
        .suggest-pill:hover {
            background: var(--fairway-light);
            border-color: var(--fairway);
            transform: translateY(-1px);
        }

        /* Prompt / Fun Fact Toast Banner */
        #feedback-banner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
            margin: 12px auto 16px;
            padding: 7px 18px;
            border-radius: 999px;
            max-width: 920px;
            line-height: 1.35;
            transition: all 0.2s;
        }
        #feedback-banner:empty {
            display: none;
        }
        .fb-prompt {
            color: var(--ink-soft);
            background: transparent;
            border: none;
            padding: 2px 0;
            border-radius: 0;
        }
        .fb-fact {
            color: var(--ink);
            background: transparent;
            border: none;
            padding: 2px 0;
            border-radius: 0;
        }
        .fb-hit {
            color: var(--fairway-dark);
            background: #f9e3e3;
            border: 2px solid #e29c9c;
        }
        .fb-warn {
            color: var(--amber-warn);
            background: #fffbeb;
            border: 2px solid #fde68a;
        }
        .fb-miss {
            color: var(--coral-dark);
            background: var(--coral-bg);
            border: 2px solid #fecdcd;
        }

        /* 3x2 Collectible Sticker Category Grid */
        .golf-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 8px 0 24px;
            text-align: left;
        }

        @media (max-width: 780px) {
            .golf-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 540px) {
            .golf-grid { grid-template-columns: 1fr; }
            #game-container { padding: 22px 16px; border-radius: 26px; }
            h1 { font-size: 2rem; }
        }

        .cat-card {
            background-color: var(--card-surface);
            border: 3px solid var(--sage-border);
            border-radius: 24px;
            padding: 18px 18px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 172px;
            position: relative;
            box-shadow: 0 7px 0 var(--sage-shadow), 0 10px 20px rgba(57, 38, 38, 0.05);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, background-color 0.2s, box-shadow 0.18s;
            overflow: hidden;
        }

        /* Subtle decorative corner grass/hill curve inside each card */
        .cat-card::after {
            content: "";
            position: absolute;
            right: -18px;
            bottom: -18px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(211, 168, 168, 0.16);
            pointer-events: none;
        }

        .cat-card.clickable {
            cursor: pointer;
        }
        .cat-card.clickable:hover {
            border-color: var(--fairway);
            transform: translateY(-4px);
            box-shadow: 0 11px 0 #cf9595, 0 16px 28px rgba(57, 38, 38, 0.1);
        }

        .cat-card.cleared {
            background: linear-gradient(180deg, #fdf1f1 0%, #f8dcdc 100%);
            border-color: var(--fairway-border);
            box-shadow: 0 7px 0 #b75252, 0 10px 22px rgba(174, 60, 60, 0.12);
        }
        .cat-card.cleared::after {
            background: rgba(174, 60, 60, 0.15);
        }

        .cat-card.flash-hit {
            animation: cardBouncePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardBouncePop {
            0% { transform: scale(0.95); }
            45% { transform: scale(1.04) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }

        .cat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }

        .cat-badge-cluster {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        .cat-icon-bubble {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            background: #f8eeee;
            border: 2px solid #ebd3d3;
            box-shadow: 0 2px 0 #ebd3d3;
            flex-shrink: 0;
        }
        .cat-card.cleared .cat-icon-bubble {
            background: #ffffff;
            border-color: #e08c8c;
            box-shadow: 0 2px 0 #e08c8c;
        }

        .group-badge {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1.5px solid transparent;
        }
        .group-taxonomy { color: #0369a1; background: #e0f2fe; border-color: #bae6fd; }
        .group-geography { color: #b45309; background: #fef3c7; border-color: #fde68a; }
        .group-biology { color: #15803d; background: #dcfce7; border-color: #bbf7d0; }
        .group-name { color: #9333ea; background: #f3e8ff; border-color: #e9d5ff; }

        .cat-count {
            font-size: 0.74rem;
            color: var(--ink-muted);
            font-weight: 800;
            background: #faf2f2;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1.5px solid #efe0e0;
        }
        .cat-card.cleared .cat-count {
            background: rgba(255, 255, 255, 0.75);
            color: var(--fairway-dark);
            border-color: #e5a9a9;
        }

        .cat-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.14rem;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 5px 0;
            line-height: 1.22;
        }

        .cat-desc {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--ink-soft);
            line-height: 1.38;
            margin-bottom: 0;
            flex-grow: 1;
        }

        .cat-hit-bubbles {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
            flex: 1 1 0;
            min-width: 0;
        }

        .hit-chip {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.74rem;
            font-weight: 600;
            background: #ffffff;
            color: var(--fairway-dark);
            border: 2px solid var(--fairway);
            box-shadow: 0 2px 0 var(--fairway);
            padding: 2px 9px;
            border-radius: 999px;
            display: inline-block;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.35;
            cursor: default;
        }

        /* Stroke Log & Post-Game Panel */
        .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 6px;
        }

        .strokes-log {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .stroke-badge {
            background: #ffffff;
            border: 2.5px solid var(--sage-border);
            box-shadow: 0 4px 0 var(--sage-shadow);
            border-radius: 999px;
            padding: 7px 15px;
            font-size: 0.86rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .stroke-badge .s-num {
            font-family: 'Fredoka', sans-serif;
            color: var(--ink-soft);
            font-weight: 600;
            font-size: 0.76rem;
            text-transform: uppercase;
            background: #f7e8e8;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .stroke-badge .s-name {
            color: var(--ink);
            font-weight: 900;
        }
        .stroke-badge .s-cnt {
            background: var(--fairway-light);
            border: 1.5px solid #e29c9c;
            color: var(--fairway-dark);
            font-weight: 800;
            font-size: 0.76rem;
            padding: 2px 9px;
            border-radius: 999px;
        }

        /* Result & Clubhouse Trophy Box */
        #result-panel {
            background: linear-gradient(180deg, #fffef9 0%, #fcf1f1 100%);
            border: 3px solid var(--fairway-border);
            box-shadow: 0 8px 0 #c97474, 0 14px 30px rgba(57, 38, 38, 0.1);
            border-radius: 26px;
            padding: 24px 26px;
            text-align: center;
        }

        .golf-rating {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--gold);
            margin-bottom: 18px;
        }

        .share-btn {
            display: block;
            margin: -6px auto 4px;
        }

        .golf-sub {
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 16px;
        }

        .optimal-box {
            background: #ffffff;
            border: 2.5px solid var(--sage-border);
            border-radius: 20px;
            padding: 16px 20px;
            text-align: left;
            margin-top: 16px;
        }

        .top-answers { margin-top: 14px; }
        .top-answers > summary {
            cursor: pointer;
            list-style: none;
            user-select: none;
        }
        .top-answers > summary::-webkit-details-marker { display: none; }
        .top-answers > summary::before {
            content: "▸";
            display: inline-block;
            width: 14px;
            transition: transform 0.15s;
        }
        .top-answers[open] > summary::before { transform: rotate(90deg); }
        .top-answers:not([open]) > summary { margin-bottom: 0; }
        .repeat-cat { color: var(--ink-muted); }

        .optimal-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--fairway-dark);
            margin-bottom: 10px;
        }

        .opt-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }
        .opt-row:last-child { margin-bottom: 0; }

        .opt-mon {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream-inner);
            border: 2px solid var(--sage-border);
            box-shadow: 0 2px 0 var(--sage-border);
            padding: 4px 12px;
            border-radius: 999px;
        }
        .opt-mon.gold-hio {
            background: var(--gold-bg);
            border-color: var(--gold-border);
            box-shadow: 0 2px 0 var(--gold-border);
            color: #92400e;
        }

        .opt-cats {
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.82rem;
            padding-left: 6px;
            line-height: 1.45;
        }
        .opt-cats s.missed-cat {
            color: var(--ink-muted);
            text-decoration: line-through;
            opacity: 0.75;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .secondary-btn {
            font-family: 'Fredoka', sans-serif;
            background: #ffffff;
            color: var(--ink-soft);
            border: 2.5px solid var(--sage-border);
            box-shadow: 0 4px 0 var(--sage-shadow);
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s, color 0.15s;
        }
        .secondary-btn:hover {
            border-color: var(--fairway);
            color: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--sage-shadow);
        }
        .secondary-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--sage-shadow);
        }
        .secondary-btn.danger {
            border-color: #f8b4b4;
            box-shadow: 0 4px 0 #f29a9a;
            color: var(--coral-dark);
        }
        .secondary-btn.danger:hover {
            background: var(--coral-bg);
            border-color: var(--coral);
            color: var(--coral-dark);
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(51, 31, 31, 0.55);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }
        .picker-box {
            background: var(--cream-card);
            border: 3px solid var(--sage-border);
            border-radius: 28px;
            width: 100%;
            max-width: 460px;
            padding: 26px;
            box-shadow: 0 10px 0 var(--sage-shadow), 0 25px 50px rgba(51, 31, 31, 0.25);
            text-align: center;
        }
        .picker-box h2 {
            font-family: 'Fredoka', sans-serif;
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--ink);
            margin-bottom: 16px;
        }
        .cal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .cal-month-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--ink);
        }
        .cal-nav-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
            background: #ffffff;
            border: 2px solid var(--sage-border);
            box-shadow: 0 3px 0 var(--sage-shadow);
            color: var(--ink);
            border-radius: 999px;
            padding: 5px 13px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.12s;
        }
        .cal-nav-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: var(--fairway);
        }
        .cal-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            padding: 4px;
        }
        .game-num-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            background: #ffffff;
            border: 2px solid var(--sage-border);
            box-shadow: 0 3px 0 var(--sage-shadow);
            border-radius: 14px;
            cursor: pointer;
            color: var(--ink);
            transition: transform 0.12s, background 0.12s, border-color 0.12s;
            font-size: 0.92rem;
            padding: 2px;
        }
        .game-num-btn.empty-day {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }
        .game-num-btn.future-day {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
            background: #f7f0f0;
        }
        .game-num-btn.done-day {
            background: #f9e9e9;
            border-color: #d47c7c;
        }
        .game-num-btn small {
            font-family: 'Nunito', sans-serif;
            font-size: 0.58rem;
            color: var(--ink-soft);
            font-weight: 800;
            margin-top: 1px;
        }
        .game-num-btn:hover:not(.empty-day):not(.future-day) {
            border-color: var(--fairway);
            background: var(--fairway-light);
            transform: translateY(-2px);
        }
        .game-num-btn.active {
            background: var(--fairway);
            border-color: var(--fairway-dark);
            box-shadow: 0 3px 0 var(--fairway-dark);
            color: #ffffff;
        }
        .game-num-btn.active small { color: #f9e3e3; }

        .mon-list-modal {
            max-width: 600px;
            text-align: left;
        }
        .mon-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            padding: 6px 2px;
        }
        .mon-chip {
            background: #ffffff;
            border: 2px solid var(--sage-border);
            box-shadow: 0 2px 0 var(--sage-border);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--ink);
        }
        .mon-chip.guessed {
            background: var(--fairway-light);
            border-color: var(--fairway);
            box-shadow: 0 2px 0 var(--fairway);
            color: var(--fairway-dark);
        }

        /* Confetti Burst Particle */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 3000;
            width: 10px;
            height: 14px;
            border-radius: 2px;
            border: 1.5px solid rgba(0, 0, 0, 0.25);
            animation: confettiFall 1.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        @keyframes confettiFall {
            0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(var(--rot)); opacity: 0; }
        }

        /* Mode Switcher Tabs & 9-Hole Course Strip */
        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .mode-tab {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.86rem;
            font-weight: 600;
            background: #ffffff;
            color: var(--ink-soft);
            border: 2.5px solid var(--sage-border);
            box-shadow: 0 4px 0 var(--sage-shadow);
            padding: 8px 15px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.12s, background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.12s;
        }
        .mode-tab:hover {
            transform: translateY(-2px);
            border-color: var(--fairway-border);
            color: var(--ink);
        }
        .mode-tab.active {
            background: linear-gradient(180deg, #d04f4f 0%, #ad3737 100%);
            border-color: var(--fairway-dark);
            box-shadow: 0 4px 0 var(--fairway-dark);
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
        }
        .mode-tab small {
            font-family: 'Nunito', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            opacity: 0.85;
            background: rgba(57, 38, 38, 0.08);
            padding: 1px 7px;
            border-radius: 999px;
        }
        .mode-tab.active small {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .hole-strip-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .hole-chip-btn {
            font-family: 'Fredoka', sans-serif;
            background: #ffffff;
            border: 2px solid var(--sage-border);
            box-shadow: 0 3px 0 var(--sage-shadow);
            border-radius: 14px;
            padding: 5px 11px;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 54px;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
        }
        .hole-chip-btn:hover {
            transform: translateY(-2px);
            border-color: var(--fairway);
        }
        .hole-chip-btn.active {
            background: var(--fairway-light);
            border-color: var(--fairway);
            box-shadow: 0 3px 0 var(--fairway);
        }
        .hole-chip-btn.done {
            background: #f9e9e9;
            border-color: #d47c7c;
        }
        .hole-chip-btn .h-top {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink);
        }
        .hole-chip-btn .h-sub {
            font-family: 'Nunito', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--ink-soft);
        }

        .group-type { color: #b91c1c; background: #fee2e2; border-color: #fecaca; }
        .group-origin { color: #b45309; background: #fef3c7; border-color: #fde68a; }
        .group-evolution { color: #15803d; background: #dcfce7; border-color: #bbf7d0; }
        .group-body { color: #0369a1; background: #e0f2fe; border-color: #bae6fd; }
        .group-moves { color: #be185d; background: #fce7f3; border-color: #fbcfe8; }

        /* Pokémon sprites */
        .mon-sprite {
            image-rendering: pixelated;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .chip-sprite { width: 24px; height: 24px; margin: -6px 1px -6px -5px; }
        .fb-sprite { width: 52px; height: 52px; margin: -10px 6px -10px -6px; }
        .opt-sprite { width: 32px; height: 32px; margin: -8px 2px -8px -6px; }
        .list-sprite { width: 28px; height: 28px; margin: -7px 2px -7px -6px; }

        /* Tiny CSS Poké Ball for the input box */
        .mini-ball {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #392626;
            background: linear-gradient(180deg, #ef4444 0 45%, #392626 45% 55%, #ffffff 55% 100%);
            position: relative;
            vertical-align: middle;
        }
        .mini-ball::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #ffffff;
            border: 1.5px solid #392626;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-nav">
        <div class="top-left-actions">
            <button class="nav-pill-btn active-mode" id="today-game-btn" onclick="selectDailyMode(0)" title="Play Today's Daily Hole">
                <span>Today's Hole</span>
            </button>
            <div class="club-menu-wrap" id="club-menu-wrap">
                <button class="nav-pill-btn club-menu-trigger" id="club-menu-trigger" onclick="toggleClubMenu(event)" title="Choose a Course">
                    <span id="club-menu-icon" class="hidden"></span>
                    <span id="club-menu-label">Courses</span>
                    <span class="club-caret">▾</span>
                </button>
                <div class="club-dropdown hidden" id="club-dropdown" onclick="event.stopPropagation()">
                    <div class="club-menu-section-label">Indigo League Courses</div>
                    <button class="club-menu-item" id="tab-course-0" onclick="selectBaseCourse(0); closeClubMenu();">
                        <div class="club-item-left">
                            <div class="club-item-title">Viridian Forest</div>
                        </div>
                        <span class="club-item-badge" id="course-badge-0">Par 18</span>
                    </button>
                    <button class="club-menu-item" id="tab-course-1" onclick="selectBaseCourse(1); closeClubMenu();">
                        <div class="club-item-left">
                            <div class="club-item-title">Safari Zone</div>
                        </div>
                        <span class="club-item-badge" id="course-badge-1">Par 22</span>
                    </button>
                    <button class="club-menu-item" id="tab-course-2" onclick="selectBaseCourse(2); closeClubMenu();">
                        <div class="club-item-left">
                            <div class="club-item-title">Indigo Plateau</div>
                        </div>
                        <span class="club-item-badge" id="course-badge-2">Par 25</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="top-actions">
            <button class="nav-pill-btn" id="calendar-trigger" onclick="openPicker()" title="Daily Hole Archive Calendar">
                <img src="../img/calendar.png" alt="Calendar">
                <span>Calendar</span>
            </button>
        </div>
    </div>

    <div class="hero-header">
        <!-- Putting green + flagstick + a Poké Ball golf ball on the lip of the cup -->
        <svg class="mascot-badge" viewBox="0 0 128 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Soft green putting hill -->
            <ellipse cx="64" cy="78" rx="56" ry="15" fill="#74d393" stroke="#28854a" stroke-width="3.2"/>
            <ellipse cx="64" cy="75" rx="46" ry="10.5" fill="#99e6b2"/>
            <!-- Flagpole + pennant -->
            <path d="M82 72V12" stroke="#243b2c" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M82 13L114 23L82 34V13Z" fill="#ef6461" stroke="#243b2c" stroke-width="3" stroke-linejoin="round"/>
            <!-- The cup -->
            <ellipse cx="82" cy="74" rx="15" ry="5" fill="#243b2c"/>
            <!-- Poké Ball golf ball, rolling toward the cup -->
            <g transform="translate(46 56)">
                <circle cx="0" cy="0" r="17" fill="#ffffff" stroke="#243b2c" stroke-width="3"/>
                <path d="M-17 0A17 17 0 0 1 17 0Z" fill="#ef4444" stroke="#243b2c" stroke-width="3" stroke-linejoin="round"/>
                <path d="M-17 0H17" stroke="#243b2c" stroke-width="3.2"/>
                <circle cx="0" cy="0" r="5.6" fill="#ffffff" stroke="#243b2c" stroke-width="3"/>
                <circle cx="0" cy="0" r="2.2" fill="#ffffff" stroke="#243b2c" stroke-width="1.4"/>
                <!-- golf ball dimples on the white half -->
                <circle cx="-9" cy="7" r="1.2" fill="#d6dde3"/>
                <circle cx="-4" cy="11" r="1.2" fill="#d6dde3"/>
                <circle cx="3" cy="11.5" r="1.2" fill="#d6dde3"/>
                <circle cx="9" cy="7.5" r="1.2" fill="#d6dde3"/>
                <!-- shine on the red half -->
                <path d="M-10 -9C-7 -12.5 -2.5 -14 2 -13.6" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>
            </g>
        </svg>

        <h1>Elite Fore</h1>
    </div>

    <!-- 9-Hole Course Strip -->
    <div class="hole-strip-bar" id="hole-strip-bar"></div>

    <div class="scorecard-bar">
        <div class="score-pill">Hole <span class="val" id="course-num">#1</span></div>
        <div class="score-pill">Par <span class="val gold" id="course-par">2</span></div>
        <div class="score-pill">Swings <span class="val accent" id="stroke-count">0</span></div>
        <div class="cup-strip" id="cup-strip" title="Cleared Categories"></div>
    </div>

    <div class="input-wrapper">
        <div class="input-row">
            <div class="input-box-shell">
                <span class="input-paw-icon"><span class="mini-ball"></span></span>
                <input type="text" id="main-input" placeholder="Type a Pokémon..." autocomplete="off">
            </div>
            <button class="swing-btn" id="swing-btn" onclick="submitPokemon()">Swing!</button>
        </div>
        <div class="suggestions-bar" id="suggestions-bar"></div>
    </div>

    <div id="feedback-banner"></div>

    <div class="golf-grid" id="golf-grid"></div>

    <div class="bottom-area">
        <div id="result-panel" class="hidden">
            <div class="golf-rating" id="golf-rating-title">PAR!</div>
            <button class="secondary-btn share-btn" id="share-btn" onclick="shareResult()">Share Result</button>
            <div class="optimal-box" id="optimal-box"></div>
        </div>

        <div class="controls-row">
            <button class="secondary-btn" id="prev-hole-btn" onclick="prevCourse()">&larr; Previous Hole</button>
            <button class="secondary-btn" onclick="resetCurrentCourse(true)">&#8635; Reset Hole</button>
            <button class="secondary-btn danger" id="give-up-btn" onclick="giveUpHole()">Show Hole-in-One</button>
            <button class="secondary-btn" id="next-hole-btn" onclick="nextCourse()">Next Hole &rarr;</button>
        </div>
    </div>
</div>

<!-- Daily Archive Calendar Modal -->
<div id="picker-modal" class="modal hidden" onclick="closePicker()">
    <div class="picker-box" onclick="event.stopPropagation()">
        <h2>Daily Hole Calendar</h2>
        <div class="cal-header-row">
            <button class="cal-nav-btn" id="cal-prev-btn" onclick="shiftCalendarMonth(-1)">&larr; Prev</button>
            <div class="cal-month-title" id="cal-month-title">Month</div>
            <button class="cal-nav-btn" id="cal-next-btn" onclick="shiftCalendarMonth(1)">Next &rarr;</button>
        </div>
        <div class="cal-weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="game-grid" id="game-grid"></div>
    </div>
</div>

<!-- Category Pokémon Inspector Modal -->
<div id="inspector-modal" class="modal hidden" onclick="closeInspector()">
    <div class="picker-box mon-list-modal" onclick="event.stopPropagation()">
        <h2 id="insp-title" style="font-size:1.25rem; margin-bottom:4px;">Category</h2>
        <div id="insp-desc" style="color:var(--ink-soft); font-weight:700; font-size:0.86rem; margin-bottom:14px;"></div>
        <div class="mon-chips" id="insp-chips"></div>
    </div>
</div>

<script>

let DB = null;
let catMap = {};
let currentBoard = null;
let currentMode = "course"; // "course" | "daily" | "free"
let activeCourseIdx = 0;    // 0, 1, 2
let activeHoleIdx = 0;      // 0..8 within activeCourseIdx
let activeDailyOffset = 0;  // 0 = today, or -6..+6 to preview Mon-Sun
let holeScores = {};        // key: `${courseId}_${holeIdx}` or `daily_${dateKey}` -> { strokes, par }
let holeStates = {};        // key: `${courseId}_${holeIdx}` or `daily_${dateKey}` -> { pokemonNames, finished, gaveUp, feedbackMsg, feedbackCls }
let lastActiveView = null;  // { mode, courseIdx, holeIdx, dailyOffset, savedDateKey }
let strokes = [];           // [{ mon, hitCats, newCats }]
let clearedCats = new Set();
let holeFinished = false;
let currentHoleGaveUp = false;
let baseSignaturesSet = new Set();
let baseHioSet = new Set();

const STORAGE_KEY = "ELITE_FORE_SAVE_V1";

function getTodayDateKey() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}

function loadSavedProgressFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
            holeScores = parsed.holeScores || {};
            holeStates = parsed.holeStates || {};
            lastActiveView = parsed.lastActiveView || null;
            if (parsed.scheduleEpoch !== DAILY_EPOCH_DAY) {
                for (const store of [holeScores, holeStates]) {
                    for (const k of Object.keys(store)) {
                        if (k.startsWith("daily_")) delete store[k];
                    }
                }
                if (lastActiveView && lastActiveView.mode === "daily") lastActiveView = null;
            }
        }
    } catch (e) {
        console.warn("Could not load Elite Fore progress from localStorage:", e);
    }
}

function saveProgressToStorage() {
    try {
        const payload = {
            holeScores,
            holeStates,
            scheduleEpoch: DAILY_EPOCH_DAY,
            lastActiveView: {
                mode: currentMode,
                courseIdx: activeCourseIdx,
                holeIdx: activeHoleIdx,
                dailyOffset: activeDailyOffset,
                savedDateKey: getTodayDateKey()
            }
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
        console.warn("Could not save Elite Fore progress to localStorage:", e);
    }
}

function getCurrentHoleKey() {
    if (currentMode === "course" && DB && DB.courses && DB.courses[activeCourseIdx]) {
        return `${DB.courses[activeCourseIdx].id}_${activeHoleIdx}`;
    }
    if (currentMode === "daily" && currentBoard && currentBoard.dateKey) {
        return `daily_${currentBoard.dateKey}`;
    }
    return null;
}

function saveCurrentHoleState() {
    const key = getCurrentHoleKey();
    if (!key) return;
    const fbEl = document.getElementById("feedback-banner");
    holeStates[key] = {
        pokemonNames: strokes.map(s => s.mon.name),
        finished: holeFinished,
        gaveUp: currentHoleGaveUp,
        feedbackMsg: fbEl ? fbEl.textContent : "",
        feedbackMon: fbEl ? (fbEl.dataset.mon || "") : "",
        feedbackCls: fbEl ? fbEl.className : "fb-prompt"
    };
    saveProgressToStorage();
}

// Generic family/group aliases so typing "whale", "bear", "fox", "deer", "seal", "rhino", etc.
// can test all matching species in the database and pick the one that clears the most categories on the current board!
const GENERIC_GROUP_TERMS = {};

function normalizeStr(s) {
    return (s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['’`-]/g, " ")
        .replace(/[^a-z0-9 ]+/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function editDistance(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 99;
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
            dp[i][j] = a[i - 1] === b[j - 1]
                ? dp[i - 1][j - 1]
                : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
    }
    return dp[a.length][b.length];
}

function scorePokemonOnCurrentBoard(m) {
    const activeCats = currentBoard.categories;
    let newHits = 0;
    let totalHits = 0;
    for (const c of activeCats) {
        if (m.traits.includes(c)) {
            totalHits++;
            if (!clearedCats.has(c)) newHits++;
        }
    }
    return { newHits, totalHits, views: m.views_60d || 0 };
}

function singularizeWord(w) {
    if (w.length >= 4 && w.endsWith("mice")) return w.slice(0, -4) + "mouse";
    if (w.length > 4 && w.endsWith("ves")) return w.slice(0, -3) + "f";
    if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
    if (/(x|ch|sh|ss)es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss") && !w.endsWith("us")) return w.slice(0, -1);
    return w;
}

function pickBestForBoard(list) {
    const sorted = [...list].sort((a, b) => {
        const sa = scorePokemonOnCurrentBoard(a);
        const sb = scorePokemonOnCurrentBoard(b);
        if (sb.newHits !== sa.newHits) return sb.newHits - sa.newHits;
        if (sb.totalHits !== sa.totalHits) return sb.totalHits - sa.totalHits;
        return sb.views - sa.views;
    });
    return sorted[0];
}

function findBestPokemonMatch(rawQuery) {
    const q = normalizeStr(rawQuery);
    if (!q) return null;
    const qWords = q.split(" ");
    const qSing = [...qWords.slice(0, -1), singularizeWord(qWords[qWords.length - 1])].join(" ");
    const queries = q === qSing ? [q] : [q, qSing];

    // 1. Generic group terms ("bear", "whale", "fox") plus exact canonical/alias matches.
    // Collect every candidate species and pick the one that clears the most new categories.
    const candidates = new Map();
    for (const qq of queries) {
        for (const cName of (GENERIC_GROUP_TERMS[qq] || [])) {
            const found = DB.pokemon.find(m => m.name === cName);
            if (found) candidates.set(found.name, found);
        }
    }

    for (const m of DB.pokemon) {
        const nNorm = normalizeStr(m.name);
        if (queries.includes(nNorm)) {
            // Exact canonical name match: if not a generic group word, return immediately
            if (!queries.some(qq => GENERIC_GROUP_TERMS[qq])) return m;
            candidates.set(m.name, m);
        }
        for (const al of (m.aliases || [])) {
            if (queries.includes(normalizeStr(al))) {
                candidates.set(m.name, m);
            }
        }
    }
    if (candidates.size > 0) return pickBestForBoard(Array.from(candidates.values()));

    // 2. Head-noun match: "vole" -> any "... vole", "civets" -> any "... civet",
    // "pygmy possum" -> any name containing "pygmy" and ending in "possum".
    const headWord = singularizeWord(qWords[qWords.length - 1]);
    const modifiers = qWords.slice(0, -1);
    if (headWord.length >= 3) {
        for (const m of DB.pokemon) {
            for (const nm of [m.name, ...(m.aliases || [])]) {
                const words = normalizeStr(nm).split(" ");
                if (words[words.length - 1] !== headWord) continue;
                if (modifiers.every(w => words.slice(0, -1).includes(w))) {
                    candidates.set(m.name, m);
                    break;
                }
            }
        }
        if (candidates.size > 0) return pickBestForBoard(Array.from(candidates.values()));
    }

    // 3. Fuzzy typo match. Only forgive real typos: same number of words, and every word
    // must keep its first letter, so a typo can never swap in a different Pokémon.
    if (q.length >= 4) {
        let bestMon = null;
        let bestDist = 99;
        for (const m of DB.pokemon) {
            const allNames = [m.name, ...(m.aliases || [])];
            for (const nm of allNames) {
                const norm = normalizeStr(nm);
                const nWords = norm.split(" ");
                if (nWords.length !== qWords.length) continue;
                if (!nWords.every((w, i) => w[0] === qWords[i][0])) continue;
                const d = editDistance(q, norm);
                const maxAllowed = norm.length >= 7 ? 2 : 1;
                if (d <= maxAllowed && d < bestDist) {
                    bestDist = d;
                    bestMon = m;
                }
            }
        }
        if (bestMon) return bestMon;
    }

    return null;
}

function initDatabase(data) {
    if (data.pokemon_packed && !data.pokemon) {
        const catIds = data.categories.map(c => c.id);
        data.pokemon = data.pokemon_packed.map(row => {
            const [name, idxs, core, aliases, facts, dexId] = row;
            const traits = idxs.map(idx => catIds[idx]).filter(Boolean);
            // views_60d drives "familiar Pokémon" checks (sample solutions, tie-breaks)
            return { name, traits, core: !!core, views_60d: core ? 10000 : 1000, aliases: aliases || [], facts: facts || [], dexId };
        });
    }
    DB = data;
    catMap = {};
    for (const c of DB.categories) {
        const matching = DB.pokemon.filter(m => m.traits.includes(c.id));
        catMap[c.id] = { ...c, count: matching.length, pokemon: matching };
    }

    // Precompute pairwise dataset subset relationships (A <= B) so client-side synthesis
    // guarantees 100% independent categories
    catSubsetPairsSet = new Set();
    const allCatIds = DB.categories.map(c => c.id);
    for (const ca of allCatIds) {
        const setA = new Set(catMap[ca].pokemon.map(m => m.name));
        for (const cb of allCatIds) {
            if (ca === cb) continue;
            const setB = new Set(catMap[cb].pokemon.map(m => m.name));
            if ([...setA].every(nm => setB.has(nm))) {
                catSubsetPairsSet.add(`${ca}=>${cb}`);
            }
        }
    }

    // Index all 27 base course holes so Daily & Free Play never overlap with any Base Course hole
    baseSignaturesSet = new Set();
    baseHioSet = new Set();
    for (const course of (DB.courses || [])) {
        for (const h of course.holes) {
            baseSignaturesSet.add([...h.categories].sort().join("|"));
            for (const nm of (h.hole_in_ones || [])) {
                baseHioSet.add(nm);
            }
        }
    }

    // Reset rolling daily schedule state
    resetDailyScheduleState();

    // Load saved progress (scores, hole states, and active view) from localStorage
    loadSavedProgressFromStorage();

    if (lastActiveView && lastActiveView.savedDateKey === getTodayDateKey()) {
        if (lastActiveView.mode === "course" && DB.courses && DB.courses[lastActiveView.courseIdx]) {
            selectBaseCourse(lastActiveView.courseIdx, lastActiveView.holeIdx || 0);
            return;
        } else if (lastActiveView.mode === "daily") {
            selectDailyMode(lastActiveView.dailyOffset || 0);
            return;
        }
    }

    // Default to TODAY'S GAME on page load!
    selectDailyMode(0);
}

const DAY_NAMES_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAY_NAMES_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTH_NAMES_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTH_NAMES_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
let calendarMonthOffset = 0; // 0 = current month, -1 = previous month, etc.
let catSubsetPairsSet = new Set();
const dailyBoardCache = {};

// Rolling random daily draw state starting from Jan 1, 2024 (UTC day 19723):
// - Every daily game randomly draws from all eligible non-course pokemon for that day's Par
// - Any mon drawn is locked out for 6 months (182 days) across ALL Pars
// - Any mon with only 1 valid board (single_board: true) is locked out for 1 full year (365 days)
// - When a multi-board mon is eventually randomly drawn again 6+ months later, a brand-new
//   category board is synthesized for it
const DAILY_EPOCH_DAY = 20758; // November 1, 2026: the first daily hole
let dailyScheduleUpToDay = DAILY_EPOCH_DAY - 1;
let dailyPickByDay = {};
let dailyLastUsedDay = {};
let dailyLastWasSingle = {};
let dailyAppearanceHistory = {};
let dailyPar4NameSet = new Set();

function resetDailyScheduleState() {
    for (const k of Object.keys(dailyBoardCache)) delete dailyBoardCache[k];
    dailyScheduleUpToDay = DAILY_EPOCH_DAY - 1;
    dailyPickByDay = {};
    dailyLastUsedDay = {};
    dailyLastWasSingle = {};
    dailyAppearanceHistory = {};
    const pools = (DB && DB.daily_pools) || {};
    dailyPar4NameSet = new Set((pools.par4 || []).map(x => (x.hole_in_ones && x.hole_in_ones[0]) || ""));
}

function makeDatePrng(seed) {
    let a = (seed ^ 0x6D2B79F5) >>> 0;
    return function() {
        a = Math.imul(a ^ (a >>> 15), a | 1);
        a ^= a + Math.imul(a ^ (a >>> 7), a | 61);
        return ((a ^ (a >>> 14)) >>> 0) / 4294967296;
    };
}

function weightedPick(cards, k, rng) {
    // Weighted sampling without replacement (rare cards have a small weight)
    const keyed = cards.map(c => {
        const w = (catMap[c] && catMap[c].weight) || 1;
        return { c, key: Math.pow(rng(), 1 / w) };
    });
    keyed.sort((a, b) => b.key - a.key);
    return keyed.slice(0, k).map(x => x.c);
}

function seededShuffle(arr, rng) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function getTargetParForDayIndex(dayIndex) {
    const dow = ((dayIndex + 4) % 7 + 7) % 7; // 0=Sun, 1=Mon, ..., 6=Sat
    const monStartDay = dayIndex + 3;
    const calWeek = Math.floor(monStartDay / 7);
    if (dow >= 1 && dow <= 4) {
        return 2;
    }
    const wkndSlot = (dow === 5) ? 0 : (dow === 6 ? 1 : 2);
    const par4Slot = ((calWeek % 3) + 3) % 3;
    return (wkndSlot === par4Slot) ? 4 : 3;
}

function getDailySlotForDate(dateObj) {
    const y = dateObj.getFullYear();
    const m = dateObj.getMonth();
    const d = dateObj.getDate();
    const dow = dateObj.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
    const dayIndex = Math.floor(Date.UTC(y, m, d) / 86400000);
    const targetPar = getTargetParForDayIndex(dayIndex);
    const dateKey = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    return { y, m, d, dow, dayIndex, targetPar, dateKey };
}

function ensureDailyScheduleUpTo(targetDayIndex) {
    const pools = (DB && DB.daily_pools) || {};
    const par4Pool = pools.par4 || [];

    for (let d = dailyScheduleUpToDay + 1; d <= targetDayIndex; d++) {
        const par = getTargetParForDayIndex(d);
        const poolKey = par === 2 ? "par2" : (par === 3 ? "par3" : "par4");
        const pool = pools[poolKey] || [];

        // Keep at least 25 Par-4-capable pokemon off cooldown for weekend Par 4 games
        let reservePar4 = false;
        if (par !== 4 && par4Pool.length > 0) {
            let availP4 = 0;
            for (const x of par4Pool) {
                const nm = x.hole_in_ones[0];
                const lastD = dailyLastUsedDay[nm] !== undefined ? dailyLastUsedDay[nm] : -999999;
                const cd = (x.single_board || dailyLastWasSingle[nm]) ? 365 : 182;
                if (d - lastD >= cd) availP4++;
            }
            reservePar4 = (availP4 <= 25);
        }

        const eligible = [];
        for (const entry of pool) {
            const nm = (entry.hole_in_ones && entry.hole_in_ones[0]) || "";
            if (!nm) continue;
            const lastD = dailyLastUsedDay[nm] !== undefined ? dailyLastUsedDay[nm] : -999999;
            const cooldownDays = (entry.single_board || dailyLastWasSingle[nm]) ? 365 : 182;
            if (d - lastD < cooldownDays) continue;

            // Also ensure no individual board for this mon can ever repeat within 365 days
            const histKey = `${nm}|${par}`;
            const prevForPar = dailyAppearanceHistory[histKey] || [];
            const knownBoardsCount = 1 + ((entry.alt_boards && entry.alt_boards.length) || 0);
            if (prevForPar.length >= knownBoardsCount) {
                const boardLastUsedD = prevForPar[prevForPar.length - knownBoardsCount];
                if (d - boardLastUsedD < 365) continue;
            }

            if (reservePar4 && dailyPar4NameSet.has(nm)) continue;
            eligible.push(entry);
        }

        const cands = eligible.length > 0 ? eligible : pool;
        const rng = makeDatePrng(Math.imul(d, 2654435761));
        const chosenEntry = cands[Math.floor(rng() * cands.length)];
        const chosenName = (chosenEntry && chosenEntry.hole_in_ones && chosenEntry.hole_in_ones[0]) || "";

        const histKey = `${chosenName}|${par}`;
        const prevList = dailyAppearanceHistory[histKey] || [];
        const appearanceIdx = prevList.length;

        dailyPickByDay[d] = {
            entry: chosenEntry,
            targetPar: par,
            appearanceIdx,
            prevDays: [...prevList]
        };

        prevList.push(d);
        dailyAppearanceHistory[histKey] = prevList;
        dailyLastUsedDay[chosenName] = d;
        dailyLastWasSingle[chosenName] = Boolean(chosenEntry && chosenEntry.single_board);
    }

    if (targetDayIndex > dailyScheduleUpToDay) {
        dailyScheduleUpToDay = targetDayIndex;
    }
}

function synthesizeBoardForScheduledPick(dayIndex) {
    const pick = dailyPickByDay[dayIndex];
    if (!pick || !pick.entry) return null;
    const { entry: baseTemplate, targetPar, appearanceIdx, prevDays } = pick;

    // First time this mon is drawn for this Par (or if it only has a single valid board,
    // which is gated to <= once per 365 days), use its verified base template
    if (appearanceIdx === 0 || baseTemplate.single_board) {
        return baseTemplate;
    }

    const altBoards = baseTemplate.alt_boards || [];
    // If we have a pre-verified distinct board for this repeat appearance, use it directly!
    if (appearanceIdx <= altBoards.length) {
        const alt = altBoards[appearanceIdx - 1];
        return {
            ...baseTemplate,
            categories: alt.categories,
            sample_solution: alt.sample_solution
        };
    }

    // Collect signatures used within the last 365 days so we never repeat a board within a year
    const forbiddenSigs = new Set();
    for (const prevD of prevDays) {
        if (prevD === dayIndex || dayIndex - prevD >= 365) continue;
        const prevBoard = synthesizeBoardForScheduledPick(prevD);
        if (prevBoard && prevBoard.categories) {
            forbiddenSigs.add([...prevBoard.categories].sort().join("|"));
        }
    }

    const anchorName = (baseTemplate.hole_in_ones && baseTemplate.hole_in_ones[0]) || "";
    const anchorMon = DB.pokemon.find(x => x.name === anchorName);
    if (anchorMon) {
        const rng = makeDatePrng(Math.imul(dayIndex, 2246822519) + Math.imul(appearanceIdx, 3266489917));
        const bioCats = DB.categories.filter(c => c.group !== "name").map(c => c.id);
        const nameCats = DB.categories.filter(c => c.group === "name").map(c => c.id);
        const mBio = anchorMon.traits.filter(t => bioCats.includes(t));
        const mName = anchorMon.traits.filter(t => nameCats.includes(t));
        const rawSplits = targetPar === 2 ? [[5, 1], [4, 2]] : (targetPar === 3 ? [[7, 2], [6, 3], [8, 1]] : [[9, 3], [8, 4], [10, 2], [7, 5]]);
        const splits = seededShuffle(rawSplits, rng);

        for (const [nBio, nName] of splits) {
            if (mBio.length < nBio || mName.length < nName) continue;
            for (let attempt = 0; attempt < 90; attempt++) {
                const cand = [
                    ...weightedPick(mBio, nBio, rng),
                    ...seededShuffle(mName, rng).slice(0, nName)
                ];
                const sig = [...cand].sort().join("|");
                if (forbiddenSigs.has(sig) || baseSignaturesSet.has(sig)) continue;
                if (!areCategoriesOrthogonalClient(cand)) continue;
                const solved = solveBoardParClient(cand, targetPar);
                if (solved && solved.hole_in_ones[0] === anchorName) {
                    return {
                        ...baseTemplate,
                        categories: seededShuffle(cand, rng),
                        sample_solution: solved.sample_solution
                    };
                }
            }
        }
    }

    const allKnown = [baseTemplate, ...altBoards];
    const chosenKnown = allKnown[appearanceIdx % allKnown.length];
    return {
        ...baseTemplate,
        categories: chosenKnown.categories,
        sample_solution: chosenKnown.sample_solution
    };
}

function getDailyBoardForDate(dateObj) {
    const { y, m, d, dow, dayIndex, targetPar, dateKey } = getDailySlotForDate(dateObj);
    if (dailyBoardCache[dateKey]) {
        return dailyBoardCache[dateKey];
    }

    ensureDailyScheduleUpTo(Math.max(DAILY_EPOCH_DAY, dayIndex));
    const chosenBoard = synthesizeBoardForScheduledPick(Math.max(DAILY_EPOCH_DAY, dayIndex));

    const dateLabel = `${DAY_NAMES_FULL[dow]}, ${MONTH_NAMES_SHORT[m]} ${d}`;
    const result = {
        ...chosenBoard,
        id: `${DAY_NAMES_SHORT[dow]} ${m + 1}/${d}`,
        dateKey,
        dailyDateLabel: dateLabel,
        dow
    };
    dailyBoardCache[dateKey] = result;
    return result;
}

function toggleClubMenu(e) {
    if (e) e.stopPropagation();
    const dd = document.getElementById("club-dropdown");
    const trig = document.getElementById("club-menu-trigger");
    if (!dd || !trig) return;
    const isHidden = dd.classList.contains("hidden");
    if (isHidden) {
        dd.classList.remove("hidden");
        trig.classList.add("open");
    } else {
        closeClubMenu();
    }
}

function closeClubMenu() {
    const dd = document.getElementById("club-dropdown");
    const trig = document.getElementById("club-menu-trigger");
    if (dd) dd.classList.add("hidden");
    if (trig) trig.classList.remove("open");
}

function selectBaseCourse(courseIdx, holeIdx = 0) {
    currentMode = "course";
    activeCourseIdx = courseIdx;
    activeHoleIdx = holeIdx;
    const course = DB.courses[courseIdx];
    currentBoard = course.holes[holeIdx];
    updateModeTabsUI();
    renderHoleStrip();
    resetCurrentCourse(false);
    buildCoursePicker();
    saveProgressToStorage();
}

function selectDailyMode(dayOffset = 0) {
    currentMode = "daily";
    activeDailyOffset = dayOffset;
    const dt = new Date();
    dt.setDate(dt.getDate() + dayOffset);
    currentBoard = getDailyBoardForDate(dt);
    updateModeTabsUI();
    renderHoleStrip();
    resetCurrentCourse(false);
    buildCoursePicker();
    saveProgressToStorage();
}

function updateModeTabsUI() {
    updateNextHoleButton();
    const todayBtn = document.getElementById("today-game-btn");
    if (todayBtn) {
        const isTodayActive = currentMode === "daily" && activeDailyOffset === 0;
        todayBtn.className = "nav-pill-btn" + (isTodayActive ? " active-mode" : "");
    }

    for (let i = 0; i < 3; i++) {
        const el = document.getElementById(`tab-course-${i}`);
        if (el) {
            el.className = "club-menu-item" + (currentMode === "course" && activeCourseIdx === i ? " active" : "");
        }
    }

    const trig = document.getElementById("club-menu-trigger");
    const iconEl = document.getElementById("club-menu-icon");
    const labelEl = document.getElementById("club-menu-label");
    if (trig && iconEl && labelEl) {
        if (currentMode === "course" && DB.courses && DB.courses[activeCourseIdx]) {
            const c = DB.courses[activeCourseIdx];
            iconEl.textContent = "";
            labelEl.textContent = c.name;
            trig.classList.add("active-mode");
        } else {

function firstDailyDate() {
    const d = new Date(DAILY_EPOCH_DAY * 86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function minCalendarOffset() {
    const first = firstDailyDate();
    const today = new Date();
    return (first.getFullYear() - today.getFullYear()) * 12 + (first.getMonth() - today.getMonth());
}

function dailyDayIndexForOffset(offset) {
    const dt = new Date();
    dt.setDate(dt.getDate() + offset);
    return getDailySlotForDate(dt).dayIndex;
}

function shiftCalendarMonth(delta) {
    calendarMonthOffset = Math.max(minCalendarOffset(), Math.min(0, calendarMonthOffset + delta));
    buildCoursePicker();
}

function buildCoursePicker() {
    const grid = document.getElementById("game-grid");
    if (!grid) return;
    grid.innerHTML = "";

    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const viewDate = new Date(today.getFullYear(), today.getMonth() + calendarMonthOffset, 1);
    const viewYear = viewDate.getFullYear();
    const viewMonth = viewDate.getMonth();

    const titleEl = document.getElementById("cal-month-title");
    if (titleEl) {
        titleEl.textContent = `${MONTH_NAMES_FULL[viewMonth]} ${viewYear}`;
    }
    const nextBtn = document.getElementById("cal-next-btn");
    if (nextBtn) {
        nextBtn.disabled = calendarMonthOffset >= 0;
    }
    const prevBtn = document.getElementById("cal-prev-btn");
    if (prevBtn) {
        prevBtn.disabled = calendarMonthOffset <= minCalendarOffset();
    }

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let s = 0; s < firstDow; s++) {
        const empty = document.createElement("div");
        empty.className = "game-num-btn empty-day";
        grid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(viewYear, viewMonth, day);
        const diffDays = Math.round((cellDate - todayMid) / 86400000);
        const isFuture = diffDays > 0 || getDailySlotForDate(cellDate).dayIndex < DAILY_EPOCH_DAY;
        const { targetPar, dateKey } = getDailySlotForDate(cellDate);
        const saved = holeScores[`daily_${dateKey}`];
        const isAct = currentMode === "daily" && diffDays === activeDailyOffset;

        const btn = document.createElement("div");
        btn.className = "game-num-btn"
            + (isFuture ? " future-day" : "")
            + (saved ? " done-day" : "")
            + (isAct ? " active" : "");

        const subLabel = saved
            ? `✓ ${saved.strokes}/${targetPar}`
            : (diffDays === 0 ? `TODAY • P${targetPar}` : `PAR ${targetPar}`);

        btn.innerHTML = `<span>${day}</span><small>${subLabel}</small>`;
        if (!isFuture) {
            btn.onclick = () => {
                selectDailyMode(diffDays);
                closePicker();
            };
        }
        grid.appendChild(btn);
    }

    // Always render 6 full weeks so the calendar keeps the same height every month
    for (let s = firstDow + daysInMonth; s < 42; s++) {
        const empty = document.createElement("div");
        empty.className = "game-num-btn empty-day";
        grid.appendChild(empty);
    }
}

function launchConfettiBurst(isHoleInOne) {
    const colors = isHoleInOne
        ? ["#d33a3f", "#ffffff", "#f59e0b", "#2b2b2b", "#fbbf24"]
        : ["#d33a3f", "#ffffff", "#2b2b2b"];
    const count = isHoleInOne ? 28 : 16;
    for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.background = colors[i % colors.length];
        el.style.left = (window.innerWidth * 0.5 + (Math.random() - 0.5) * 160) + "px";
        el.style.top = (window.innerHeight * 0.38 + (Math.random() - 0.5) * 60) + "px";
        const angle = Math.random() * Math.PI * 2;
        const dist = 90 + Math.random() * 240;
        el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        el.style.setProperty("--dy", (Math.sin(angle) * dist - 60) + "px");
        el.style.setProperty("--rot", ((Math.random() - 0.5) * 520) + "deg");
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
    }
}
