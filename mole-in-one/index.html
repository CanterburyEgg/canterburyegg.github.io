function resetCurrentCourse(forceClear = false) {
    const holeKey = getCurrentHoleKey();
    if (forceClear && holeKey) {
        delete holeStates[holeKey];
        delete holeScores[holeKey];
        saveProgressToStorage();
        renderHoleStrip();
        buildCoursePicker();
    }

    strokes = [];
    clearedCats = new Set();
    holeFinished = false;
    currentHoleGaveUp = false;

    const totalCats = currentBoard ? currentBoard.categories.length : 6;
    if (currentMode === "daily") {
        document.getElementById("course-num").textContent = currentBoard.id;
    } else if (currentMode === "free") {
        document.getElementById("course-num").textContent = `FREE P${currentBoard.par}`;
    } else {
        const courseName = (DB.courses && DB.courses[activeCourseIdx]) ? DB.courses[activeCourseIdx].name : `Course ${activeCourseIdx + 1}`;
        document.getElementById("course-num").textContent = `${courseName} • #${currentBoard.id}`;
    }
    document.getElementById("course-par").textContent = currentBoard.par;

    document.getElementById("main-input").disabled = false;
    document.getElementById("main-input").value = "";
    document.getElementById("swing-btn").disabled = false;
    document.getElementById("give-up-btn").classList.remove("hidden");
    document.getElementById("result-panel").classList.add("hidden");
    const sugBar = document.getElementById("suggestions-bar");
    if (sugBar) sugBar.innerHTML = "";
    setFeedback("Guess a mammal that fits in one or more of the categories below!", "fb-prompt");

    // Restore saved hole state if present and not force-clearing
    const savedState = (!forceClear && holeKey) ? holeStates[holeKey] : null;
    if (savedState && Array.isArray(savedState.mammalNames)) {
        for (const mName of savedState.mammalNames) {
            const mammal = DB.mammals.find(m => m.name === mName);
            if (!mammal) continue;
            const hitCats = currentBoard.categories.filter(cid => mammal.traits.includes(cid));
            const newCats = hitCats.filter(cid => !clearedCats.has(cid));
            strokes.push({ mammal, hitCats, newCats });
            newCats.forEach(cid => clearedCats.add(cid));
        }
        if (savedState.feedbackMsg) {
            const lastMammal = strokes.length ? strokes[strokes.length - 1].mammal : null;
            if ((savedState.feedbackCls || "fb-fact") === "fb-fact" && lastMammal) {
                // Re-pick from the current data so corrected facts replace old saved text
                setFeedback(pickRandomMammalFact(lastMammal), "fb-fact");
            } else {
                setFeedback(savedState.feedbackMsg, savedState.feedbackCls || "fb-fact");
            }
        }
        renderScorecard();
        renderBoard([]);
        if (savedState.finished) {
            finishHole(Boolean(savedState.gaveUp), true);
            return;
        }
        document.getElementById("main-input").focus();
        return;
    }

    renderBoard([]);
    renderScorecard();
    document.getElementById("main-input").focus();
}

function renderScorecard() {
    document.getElementById("stroke-count").textContent = strokes.length;

function renderBoard(newlyHitCatIds = []) {
    const grid = document.getElementById("golf-grid");

    for (const catId of currentBoard.categories) {

let lastFactByMammal = {};
let notFoundTimer = null;

function flashInputNotFound() {
    const input = document.getElementById("main-input");
    const shell = input.closest(".input-box-shell") || input.parentElement;
    input.classList.remove("not-found");
    shell.classList.remove("shake");
    void shell.offsetWidth; // restart the animation if triggered twice in a row
    input.classList.add("not-found");
    shell.classList.add("shake");
    clearTimeout(notFoundTimer);
    notFoundTimer = setTimeout(() => {
        input.classList.remove("not-found");
        shell.classList.remove("shake");
    }, 900);
    input.select();
}

function pickRandomMammalFact(mammal) {
    const pool = (mammal && Array.isArray(mammal.facts)) ? mammal.facts : [];
    if (pool.length === 0) return "";
    if (pool.length === 1) return pool[0];
    const prev = lastFactByMammal[mammal.name];
    const filtered = pool.filter(f => f !== prev);
    const chosen = filtered[Math.floor(Math.random() * filtered.length)];
    lastFactByMammal[mammal.name] = chosen;
    return chosen;
}

function submitMammal() {
    if (holeFinished) return;
    const input = document.getElementById("main-input");
    const raw = input.value.trim();
    if (!raw) return;

    const mammal = findBestMammalMatch(raw);
    if (!mammal) {
        flashInputNotFound();
        return;
    }

    if (strokes.some(s => s.mammal.name === mammal.name)) {
        setFeedback(`🐾 You already swung with ${mammal.name} on this hole!`, "fb-warn");
        input.value = "";
        updateSuggestions();
        return;
    }

    const totalCats = currentBoard.categories.length;
    const hitCats = currentBoard.categories.filter(cid => mammal.traits.includes(cid));
    const newCats = hitCats.filter(cid => !clearedCats.has(cid));

    if (newCats.length === 0) {
        if (hitCats.length === 0) {
            setFeedback(`🍃 ${mammal.name} doesn't match any of the ${totalCats} clues here.`, "fb-warn");
        } else {
            setFeedback(`🍃 ${mammal.name} only matches clues you've already cleared.`, "fb-warn");
        }
        input.value = "";
        updateSuggestions();
        return;
    }

    strokes.push({ mammal, hitCats, newCats });
    newCats.forEach(cid => clearedCats.add(cid));
    input.value = "";
    updateSuggestions();

    const fact = pickRandomMammalFact(mammal);
    setFeedback(fact, "fb-fact");

    renderScorecard();
    renderBoard(newCats);
    saveCurrentHoleState();

    if (clearedCats.size === totalCats) {
        launchConfettiBurst(strokes.length === 1);
        finishHole(false);
    }
}

function finishHole(gaveUp, skipSave = false) {
    holeFinished = true;
    currentHoleGaveUp = Boolean(gaveUp);
    document.getElementById("main-input").disabled = true;
    document.getElementById("swing-btn").disabled = true;
    document.getElementById("give-up-btn").classList.add("hidden");
    const sugBar = document.getElementById("suggestions-bar");
    if (sugBar) sugBar.innerHTML = "";

    const panel = document.getElementById("result-panel");
    const titleEl = document.getElementById("golf-rating-title");
    const optBox = document.getElementById("optimal-box");

    panel.classList.remove("hidden");

    const totalCats = currentBoard.categories.length;
    const par = currentBoard.par;
    const s = strokes.length;

    if (gaveUp) {
        titleEl.textContent = "Hole conceded.";
        titleEl.style.color = "var(--coral-dark)";
    } else {
        const diff = s - par;
        let rating = "Par";
        let color = "var(--fairway-dark)";
        // Most swings possible is one per card (12 on a Par 4), so the worst score is +8
        const BOGEYS = ["Bogey", "Double Bogey", "Triple Bogey", "Quadruple Bogey", "Quintuple Bogey",
                        "Sextuple Bogey", "Septuple Bogey", "Octuple Bogey"];
        if (s === 1) { rating = "MOLE-IN-ONE!"; color = "var(--gold)"; }
        else if (diff <= -2) { rating = "Eagle!"; color = "var(--gold)"; }
        else if (diff === -1) { rating = "Birdie!"; color = "var(--gold)"; }
        else if (diff === 0) { rating = "Par"; color = "var(--fairway-dark)"; }
        else {
            rating = BOGEYS[Math.min(diff, BOGEYS.length) - 1];
            color = diff <= 2 ? "var(--amber-warn)" : "var(--coral-dark)";
        }

        titleEl.textContent = rating;
        titleEl.style.color = color;
    }

    if (!skipSave) {
        if (!gaveUp && currentMode === "course") {
            const course = DB.courses[activeCourseIdx];
            holeScores[`${course.id}_${activeHoleIdx}`] = { strokes: s, par };
            renderHoleStrip();
        } else if (!gaveUp && currentMode === "daily" && currentBoard.dateKey) {
            holeScores[`daily_${currentBoard.dateKey}`] = { strokes: s, par };
            buildCoursePicker();
        }
        saveCurrentHoleState();
    }

    // Show HOLE-IN-ONE (N/N) and OTHER TOP ANSWERS (>= N-2 boxes)
    const minBoxes = Math.max(1, totalCats - 2);
    const hioList = [];
    const topOthers = [];

    for (const m of DB.mammals) {
        const covered = currentBoard.categories.filter(cid => m.traits.includes(cid));
        if (covered.length === totalCats) {
            hioList.push(m);
        } else if (covered.length >= minBoxes) {
            topOthers.push({ mammal: m, count: covered.length });
        }
    }

    hioList.sort((a, b) => a.name.localeCompare(b.name));
    topOthers.sort((a, b) => b.count - a.count || a.mammal.name.localeCompare(b.mammal.name));

    let rowsHtml = "";

    // YOUR ANSWERS: always shown, each guess with the cards it fits on this board
    rowsHtml += `<div class="optimal-title">YOUR ANSWERS</div>`;
    if (strokes.length === 0) {
        rowsHtml += `<div class="opt-row"><span class="opt-cats">No swings taken</span></div>`;
    }
    for (const st of strokes) {
        const newSet = new Set(st.newCats);
        const catsHtml = st.hitCats
            .map(cid => newSet.has(cid) ? catMap[cid].name : `<span class="repeat-cat">${catMap[cid].name}</span>`)
            .join(" • ");
        rowsHtml += `
            <div class="opt-row">
                <span class="opt-mammal">${st.mammal.name}</span>
                <span class="opt-cats">${catsHtml}</span>
            </div>
        `;
    }

    if (hioList.length > 0) {
        rowsHtml += `<div class="optimal-title" style="margin-top: 14px;">MOLE-IN-ONE</div>`;
        for (const m of hioList) {
            rowsHtml += `
                <div class="opt-row">
                    <span class="opt-mammal gold-hio">${m.name}</span>
                </div>
            `;
        }
    }

    if (topOthers.length > 0) {
        // Collapsed by default so the Next button stays close
        rowsHtml += `<details class="top-answers"><summary class="optimal-title">OTHER TOP ANSWERS (${topOthers.length})</summary>`;
        for (const item of topOthers) {
            const m = item.mammal;
            const traitSet = new Set(m.traits);
            const allCatsHtml = currentBoard.categories
                .map(cid => {
                    const nm = catMap[cid].name;
                    return traitSet.has(cid) ? nm : `<s class="missed-cat">${nm}</s>`;
                })
                .join(" • ");
            rowsHtml += `
                <div class="opt-row">
                    <span class="opt-mammal">${m.name}</span>
                    <span class="opt-cats">${allCatsHtml}</span>
                </div>
            `;
        }
        rowsHtml += `</details>`;
    }
    optBox.innerHTML = rowsHtml;

    renderBoard([]);
}

// Spoiler-free result: which hole, the score, and one row per swing showing which cards
// (by position only) that swing cleared. No names of any kind.
const SHARE_GAME_TITLE = "Mole in One";
const SHARE_SQUARE = "🟩";
const SHARE_EMPTY = "⬜";
const SHARE_REPEAT = "🟨";  // fits the card, but an earlier swing already cleared it
const SHARE_URL = "https://canterburyegg.github.io/mole-in-one/";

function buildShareText() {
    if (!currentBoard) return "";
    let where;
    if (currentMode === "daily") {
        where = `Daily Hole · ${currentBoard.dailyDateLabel || currentBoard.dateKey}`;
    } else {
        const course = DB.courses[activeCourseIdx];
        where = `${course.name} · Hole ${activeHoleIdx + 1}`;
    }
    const par = currentBoard.par;
    const rating = (document.getElementById("golf-rating-title").textContent || "").trim();
    const swings = `${strokes.length} swing${strokes.length === 1 ? "" : "s"}`;
    const score = currentHoleGaveUp ? `Conceded after ${swings}` : `${rating} ${strokes.length}/${par}`;
    const rows = strokes.map(st => {
        const cleared = new Set(st.newCats);
        const fits = new Set(st.hitCats);
        return currentBoard.categories
            .map(c => cleared.has(c) ? SHARE_SQUARE : (fits.has(c) ? SHARE_REPEAT : SHARE_EMPTY))
            .join("");
    });
    const lines = [`${SHARE_GAME_TITLE} · ${where} · Par ${par}`, "", score, ...rows, "", SHARE_URL];
    return lines.join("\n");
}

function copyTextFallback(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
}

function shareResult() {
    const text = buildShareText();
    const btn = document.getElementById("share-btn");
    const done = () => {
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Share Result"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => { copyTextFallback(text); done(); });
    } else {
        copyTextFallback(text);
        done();
    }
}

function giveUpHole() {
    if (holeFinished) return;
    finishHole(true);
}

function nextCourse() {
    if (currentMode === "free") {
        startFreePlay(currentBoard ? currentBoard.par : 2);
    } else if (currentMode === "daily") {
        // Tomorrow's hole doesn't exist yet, so there's no Next from today
        if (activeDailyOffset < 0) selectDailyMode(activeDailyOffset + 1);
    } else {
        const course = DB.courses[activeCourseIdx];
        const nextHole = (activeHoleIdx + 1) % course.holes.length;
        selectBaseCourse(activeCourseIdx, nextHole);
    }
}

function prevCourse() {
    if (currentMode === "daily") {
        selectDailyMode(activeDailyOffset - 1);
    } else if (currentMode === "course") {
        const course = DB.courses[activeCourseIdx];
        const prevHole = (activeHoleIdx - 1 + course.holes.length) % course.holes.length;
        selectBaseCourse(activeCourseIdx, prevHole);
    }
}

function updateNextHoleButton() {
    const nextBtn = document.getElementById("next-hole-btn");
    const prevBtn = document.getElementById("prev-hole-btn");
    if (nextBtn) {
        const hideNext = currentMode === "daily" && activeDailyOffset >= 0;
        nextBtn.classList.toggle("hidden", hideNext);
    }
    if (prevBtn) {
        prevBtn.classList.toggle("hidden", currentMode === "free");
    }
}

function areCategoriesOrthogonalClient(chosen) {
    const s = new Set(chosen);
    if (s.has("aquatic_semiaquatic") && s.has("terrestrial_only")) return false;
    if (s.has("single_continent") && s.has("multi_continent")) return false;
    if (s.has("new_world_only") && s.has("old_world_only")) return false;
    if ((s.has("new_world_only") || s.has("old_world_only")) && s.has("single_continent")) return false;
    if (s.has("name_single_word") && s.has("name_multi_word")) return false;
    if (s.has("name_starts_vowel") && s.has("name_starts_consonant")) return false;
    if (s.has("name_ends_vowel") && s.has("name_ends_consonant")) return false;

    if (s.has("fully_marine") && (s.has("aquatic_semiaquatic") || s.has("multi_continent") || s.has("limbs_flippers"))) return false;
    if (s.has("limbs_flippers") && (s.has("aquatic_semiaquatic") || s.has("fully_marine"))) return false;
    if (s.has("order_primates") && (s.has("limbs_grasping") || s.has("arboreal_tree"))) return false;
    if (s.has("horns_antlers_tusks") && s.has("ungulate")) return false;
    if (s.has("new_world_only") && ["native_africa", "native_asia", "native_europe", "native_australia"].some(x => s.has(x))) return false;
    if (s.has("old_world_only") && ["native_north_america", "native_south_america"].some(x => s.has(x))) return false;
    if (s.has("name_short_5") && s.has("name_single_word")) return false;
    if (s.has("name_has_hyphen") && s.has("name_multi_word")) return false;
    if ((s.has("name_has_color") || s.has("name_has_geo") || s.has("name_body_or_animal")) && s.has("name_multi_word")) return false;

    const taxCats = ["order_carnivora", "order_rodentia", "order_primates", "ungulate", "marsupial_monotreme", "fully_marine"];
    const limbCats = ["ungulate", "limbs_paws_claws", "limbs_grasping", "limbs_flippers"];
    const dietCats = ["diet_herbivore", "diet_carnivore", "diet_insectivore", "diet_omnivore"];
    const weightCats = ["weight_over_200kg", "weight_medium", "weight_under_5kg"];
    const continentCats = ["native_africa", "native_asia", "native_north_america", "native_south_america", "native_europe", "native_australia"];
    const lenCats = ["name_short_5", "name_medium_6_11", "name_long_12"];

    const countIn = grp => grp.filter(x => s.has(x)).length;
    if (countIn(taxCats) > 1) return false;
    if (countIn(limbCats) > 1) return false;
    if (countIn(dietCats) > 1) return false;
    if (countIn(weightCats) > 1) return false;
    if (countIn(lenCats) > 1) return false;
    if (countIn(continentCats) > 1 && (s.has("single_continent") || s.has("multi_continent") || s.has("island_endemic"))) return false;
    if (s.has("island_endemic") && (s.has("single_continent") || s.has("multi_continent"))) return false;
    if (s.has("new_world_only") && s.has("multi_continent") && (s.has("native_north_america") || s.has("native_south_america"))) return false;
    if (countIn(continentCats) >= 1 && s.has("single_continent") && (s.has("new_world_only") || s.has("old_world_only"))) return false;
    if ((s.has("arboreal_tree") || s.has("flight_or_gliding") || s.has("burrowing_den") || s.has("order_primates")) && s.has("terrestrial_only")) return false;
    if (s.has("order_rodentia") && s.has("limbs_paws_claws")) return false;
    if (s.has("name_long_12") && s.has("name_multi_word")) return false;
    if (countIn(continentCats) > 2) return false;

    for (let i = 0; i < chosen.length; i++) {
        for (let j = 0; j < chosen.length; j++) {
            if (i !== j && catSubsetPairsSet.has(`${chosen[i]}=>${chosen[j]}`)) {
                return false;
            }
        }
    }
    return true;
}

// Client-side solver for Par 2 (6 boxes), Par 3 (9 boxes), or Par 4 (12 boxes) boards
// Enforces STRICTLY ONE (1-of-1) Mole-in-One mammal and zero overlap with Base Courses
function solveBoardParClient(chosenCats, par) {
    const sig = [...chosenCats].sort().join("|");
    if (baseSignaturesSet.has(sig)) return null;

    const targetMask = (1 << chosenCats.length) - 1;
    const idxMap = {};
    chosenCats.forEach((cid, i) => { idxMap[cid] = i; });

    const hios = [];
    const partials = [];
    const maxPartial = chosenCats.length - 2;
    for (const m of DB.mammals) {
        let mask = 0;
        let popCount = 0;
        for (const t of m.traits) {
            if (idxMap[t] !== undefined) {
                mask |= (1 << idxMap[t]);
                popCount++;
            }
        }
        if (mask === targetMask) {
            hios.push({ name: m.name, views: m.views_60d || 10000 });
            if (hios.length > 1) return null; // Must be strictly 1-of-1!
        } else if (popCount >= 2 && popCount <= maxPartial && (m.views_60d || 0) >= 5000) {
            partials.push({ mask, popCount, name: m.name, views: m.views_60d || 10000 });
        }
    }

    if (hios.length !== 1) return null;

    partials.sort((a, b) => b.popCount - a.popCount || b.views - a.views);
    const top = partials.slice(0, 45);

    if (par === 2) {
        for (let i = 0; i < top.length; i++) {
            for (let j = i + 1; j < top.length; j++) {
                if ((top[i].mask | top[j].mask) === targetMask) {
                    return {
                        par: 2,
                        hole_in_ones: [hios[0].name],
                        sample_solution: [top[i].name, top[j].name]
                    };
                }
            }
        }
    } else if (par === 3) {
        for (let i = 0; i < Math.min(30, top.length); i++) {
            for (let j = i + 1; j < Math.min(35, top.length); j++) {
                const m12 = top[i].mask | top[j].mask;
                for (let k = j + 1; k < Math.min(40, top.length); k++) {
                    if ((m12 | top[k].mask) === targetMask) {
                        return {
                            par: 3,
                            hole_in_ones: [hios[0].name],
                            sample_solution: [top[i].name, top[j].name, top[k].name]
                        };
                    }
                }
            }
        }
    } else if (par === 4) {
        for (let i = 0; i < Math.min(28, top.length); i++) {
            for (let j = i + 1; j < Math.min(32, top.length); j++) {
                const m12 = top[i].mask | top[j].mask;
                if (m12 === top[i].mask || m12 === top[j].mask) continue;
                for (let k = j + 1; k < Math.min(38, top.length); k++) {
                    const m123 = m12 | top[k].mask;
                    if (m123 === targetMask) {
                        return {
                            par: 4,
                            hole_in_ones: [hios[0].name],
                            sample_solution: [top[i].name, top[j].name, top[k].name]
                        };
                    }
                    for (let l = k + 1; l < Math.min(42, top.length); l++) {
                        if ((m123 | top[l].mask) === targetMask) {
                            return {
                                par: 4,
                                hole_in_ones: [hios[0].name],
                                sample_solution: [top[i].name, top[j].name, top[k].name, top[l].name]
                            };
                        }
                    }
                }
            }
        }
    }
    return null;
}

function startFreePlay(targetPar = 2) {
    const par = (targetPar === 3 || targetPar === 4) ? targetPar : 2;
    const nBio = par === 2 ? 5 : (par === 3 ? 7 : 9);
    const nName = par === 2 ? 1 : (par === 3 ? 2 : 3);

    const bioCats = DB.categories.filter(c => c.group !== "name").map(c => c.id);
    const nameCats = DB.categories.filter(c => c.group === "name").map(c => c.id);

    const shuffle = arr => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    };

    const candidates = shuffle(DB.mammals.filter(m => (m.views_60d || 0) >= 5000 && !baseHioSet.has(m.name)));
    for (const anchor of candidates) {
        const mBio = anchor.traits.filter(t => bioCats.includes(t));
        const mName = anchor.traits.filter(t => nameCats.includes(t));
        if (mBio.length < nBio || mName.length < nName) continue;

        for (let attempt = 0; attempt < 25; attempt++) {
            const chosen = [
                ...shuffle(mBio).slice(0, nBio),
                ...shuffle(mName).slice(0, nName)
            ];
            if (!areCategoriesOrthogonalClient(chosen)) continue;
            const solved = solveBoardParClient(chosen, par);
            if (solved) {
                currentMode = "free";
                currentBoard = {
                    id: "FREE",
                    par: solved.par,
                    categories: shuffle(chosen),
                    hole_in_ones: solved.hole_in_ones,
                    sample_solution: solved.sample_solution
                };
                updateModeTabsUI();
                renderHoleStrip();
                resetCurrentCourse();
                buildCoursePicker();
                return;
            }
        }
    }
}

function openPicker() {
    document.getElementById("picker-modal").classList.remove("hidden");
}
function closePicker() {
    document.getElementById("picker-modal").classList.add("hidden");
}

function openInspector(catId) {
    const cat = catMap[catId];
    if (!cat) return;
    const icon = CAT_ICONS[catId] || "🐾";
    document.getElementById("insp-title").textContent = `${icon} ${cat.name} (${cat.count})`;
    document.getElementById("insp-desc").textContent = cat.desc;
    const chips = document.getElementById("insp-chips");
    chips.innerHTML = "";
    const guessedSet = new Set(strokes.map(s => s.mammal.name));
    const sortedMammals = [...cat.mammals].sort((a, b) => a.name.localeCompare(b.name));
    for (const m of sortedMammals) {
        const sp = document.createElement("span");
        sp.className = "mammal-chip" + (guessedSet.has(m.name) ? " guessed" : "");
        sp.textContent = (guessedSet.has(m.name) ? "⛳ " : "🐾 ") + m.name;
        chips.appendChild(sp);
    }
    document.getElementById("inspector-modal").classList.remove("hidden");
}
function closeInspector() {
    document.getElementById("inspector-modal").classList.add("hidden");
}
