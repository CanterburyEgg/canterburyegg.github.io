<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Party Trivia</title>
    <meta name="description" content="Guess the Halloween movie or TV Halloween episode in 6 frames.">
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0c0b;
            --surface: #171513;
            --surface-2: #221f1c;
            --surface-hover: #2c2824;
            --border: rgba(255, 245, 235, 0.1);
            --border-strong: rgba(255, 245, 235, 0.2);
            --text: #f3efe9;
            --text-muted: #9a9187;
            --text-dim: #5e574f;
            --accent: #e86a17;
            --accent-hover: #f47b2a;
            --miss: #b83a3a;
            --win: #2e9b58;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 28%, #1a1510 0%, #0d0c0b 70%);
            color: var(--text);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header --- */
        header {
            width: 100%;
            max-width: 1180px;
            height: 60px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin: 0;
            color: var(--text);
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        .mode-switch {
            display: inline-flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .mode-btn:hover {
            color: var(--text);
        }

        .mode-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .round-nav {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .nav-arrow {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .nav-arrow:hover:not(:disabled) {
            background: var(--surface-hover);
            color: var(--text);
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .round-picker-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            min-width: 74px;
            transition: background 0.15s ease;
        }

        .round-picker-btn:hover {
            background: var(--surface-hover);
        }

        /* Round Picker Popover */
        .round-popover {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 268px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
            z-index: 500;
        }

        .round-popover.open {
            display: block;
        }

        .round-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .round-cell {
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .round-cell:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .round-cell.current {
            border-color: var(--accent);
            color: var(--text);
        }

        .round-cell.won {
            background: rgba(46, 155, 88, 0.22);
            border-color: rgba(46, 155, 88, 0.55);
            color: #9be7b8;
        }

        .round-cell.lost {
            background: rgba(184, 58, 58, 0.22);
            border-color: rgba(184, 58, 58, 0.55);
            color: #f0a3a3;
        }

        .popover-footer {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popover-score {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            padding: 2px 4px;
        }

        .reset-btn:hover {
            color: var(--miss);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            width: 100%;
            max-width: 1180px;
            padding: 4px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 0;
        }

        .frame-stage {
            position: relative;
            width: min(92vw, 1080px, calc((100vh - 235px) * 16 / 9));
            aspect-ratio: 16 / 9;
            background: #050505;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        }

        #frame-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.14s ease;
        }

        #frame-image.loading {
            opacity: 0.25;
        }

        /* --- Frame Tabs [1..6] --- */
        .frame-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .frame-tab {
            width: 42px;
            height: 38px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
        }

        .frame-tab:hover:not(:disabled) {
            background: var(--surface-hover);
        }

        .frame-tab.missed {
            background: rgba(184, 58, 58, 0.18);
            border-color: rgba(184, 58, 58, 0.45);
            color: #e9b4b4;
        }

        .frame-tab.solved {
            background: var(--win);
            border-color: var(--win);
            color: #fff;
        }

        .frame-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-1px);
        }

        .frame-tab.solved.active {
            background: var(--win);
            border-color: #7be0a0;
        }

        .frame-tab:disabled {
            background: rgba(255, 255, 255, 0.025);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            cursor: default;
        }

        /* --- Controls / Reveal Area --- */
        .interaction-area {
            width: min(92vw, 680px);
            min-height: 92px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .guess-bar {
            width: 100%;
            display: flex;
            gap: 8px;
            position: relative;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        #guess-input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        #guess-input::placeholder {
            color: var(--text-dim);
        }

        #guess-input:focus {
            border-color: var(--accent);
            background: var(--surface-2);
        }

        .action-btn {
            height: 46px;
            padding: 0 20px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-skip {
            background: var(--surface-2);
            border-color: var(--border);
            color: var(--text-muted);
        }

        .btn-skip:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* Autocomplete pops UPWARD so it never goes off a TV screen */
        .autocomplete {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.7);
            max-height: 280px;
            overflow-y: auto;
            z-index: 400;
        }

        .autocomplete.open {
            display: block;
        }

        .ac-item {
            padding: 11px 16px;
            font-size: 0.96rem;
            color: var(--text);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .ac-item:last-child {
            border-bottom: none;
        }

        .ac-item:hover,
        .ac-item.highlighted {
            background: var(--accent);
            color: #fff;
        }

        /* Compact wrong-guess trail */
        .guess-trail {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 28px;
        }

        .guess-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 5px;
            background: rgba(184, 58, 58, 0.14);
            border: 1px solid rgba(184, 58, 58, 0.32);
            color: #d8c0c0;
            font-size: 0.82rem;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .guess-chip .mark {
            color: var(--miss);
            font-weight: 700;
        }

        /* Reveal Banner */
        .reveal-box {
            display: none;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border-strong);
        }

        .reveal-box.won {
            border-color: rgba(46, 155, 88, 0.6);
            background: rgba(46, 155, 88, 0.12);
        }

        .reveal-box.lost {
            border-color: rgba(184, 58, 58, 0.55);
            background: rgba(184, 58, 58, 0.1);
        }

        .reveal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .reveal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reveal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 680px) {
            header {
                height: auto;
                padding: 12px 14px;
                grid-template-columns: 1fr auto;
                row-gap: 10px;
            }
            .mode-switch {
                grid-column: 1 / -1;
                justify-self: center;
                order: 3;
            }
            .frame-stage {
                width: 94vw;
            }
            .frame-tab {
                width: 38px;
                height: 36px;
            }
            .action-btn {
                padding: 0 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"></div>

        <nav class="mode-switch" aria-label="Game mode">
            <button id="mode-movies" class="mode-btn active" type="button">Movies</button>
            <button id="mode-tv" class="mode-btn" type="button">TV Episodes</button>
        </nav>

        <div class="round-nav">
            <button id="prev-round-btn" class="nav-arrow" type="button" aria-label="Previous round">‹</button>
            <button id="round-picker-toggle" class="round-picker-btn" type="button">1 / 25</button>
            <button id="next-round-btn" class="nav-arrow" type="button" aria-label="Next round">›</button>

            <div id="round-popover" class="round-popover">
                <div id="round-grid" class="round-grid"></div>
                <div class="popover-footer">
                    <span id="popover-score" class="popover-score">0 / 25 solved</span>
                    <button id="reset-mode-btn" class="reset-btn" type="button">Reset</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="frame-stage">
            <img id="frame-image" alt="Mystery frame" draggable="false">
        </div>

        <div id="frame-tabs" class="frame-tabs" role="tablist" aria-label="Frames"></div>

        <div class="interaction-area">
            <div id="guess-bar" class="guess-bar">
                <div class="search-wrap">
                    <div id="autocomplete" class="autocomplete" role="listbox"></div>
                    <input id="guess-input" type="text" placeholder="Search for a movie..." autocomplete="off" spellcheck="false">
                </div>
                <button id="submit-btn" class="action-btn btn-submit" type="button">Submit</button>
                <button id="skip-btn" class="action-btn btn-skip" type="button">Skip</button>
            </div>

            <div id="reveal-box" class="reveal-box">
                <div class="reveal-info">
                    <div id="reveal-title" class="reveal-title"></div>
                    <div id="reveal-sub" class="reveal-sub"></div>
                </div>
                <button id="reveal-next-btn" class="action-btn btn-submit" type="button">Next →</button>
            </div>

            <div id="guess-trail" class="guess-trail"></div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'halloween_party_v2';

        const state = {
            data: null,
            mode: 'movies',       // 'movies' | 'tv'
            index: { movies: 0, tv: 0 },
            activeFrame: 0,       // 0..5
            progress: {},         // { [puzzleId]: { guesses: string[], status: 'playing'|'won'|'lost' } }
            acMatches: [],
            acHighlight: -1
        };

        function decodeB64(str) {
            if (!str) return '';
            const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function normTitle(s) {
            return s
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function loadSaved() {
            try {
                localStorage.removeItem('halloween_framed_party_v1');
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.mode === 'movies' || parsed.mode === 'tv') state.mode = parsed.mode;
                if (parsed.index) state.index = { ...state.index, ...parsed.index };
                if (parsed.progress) state.progress = parsed.progress;
            } catch (_) {}
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    mode: state.mode,
                    index: state.index,
                    progress: state.progress
                }));
            } catch (_) {}
        }

        function currentList() {
            return state.data ? state.data[state.mode] : [];
        }

        function currentCatalog() {
            if (!state.data) return [];
            return state.mode === 'movies' ? state.data.movieTitles : state.data.tvTitles;
        }

        function currentPuzzle() {
            const list = currentList();
            const idx = Math.max(0, Math.min(state.index[state.mode] || 0, list.length - 1));
            state.index[state.mode] = idx;
            return list[idx];
        }

        function getPuzzleState(puzzle) {
            if (!state.progress[puzzle.id]) {
                state.progress[puzzle.id] = { guesses: [], status: 'playing' };
            }
            return state.progress[puzzle.id];
        }

        function maxUnlockedFrame(pState) {
            if (pState.status !== 'playing') return 5;
            return Math.min(5, pState.guesses.length);
        }

        function preloadFrames(puzzle, upTo) {
            const limit = Math.min(5, upTo + 1);
            for (let i = 0; i <= limit; i++) {
                const img = new Image();
                img.src = puzzle.frames[i];
            }
        }

        function setDisplayedFrame(frameIdx) {
            const puzzle = currentPuzzle();
            if (!puzzle) return;
            state.activeFrame = frameIdx;
            const imgEl = document.getElementById('frame-image');
            const nextSrc = puzzle.frames[frameIdx];
            if (imgEl.dataset.src !== nextSrc) {
                imgEl.classList.add('loading');
                imgEl.onload = () => imgEl.classList.remove('loading');
                imgEl.onerror = () => imgEl.classList.remove('loading');
                imgEl.dataset.src = nextSrc;
                imgEl.src = nextSrc;
            }
            renderTabs();
        }

        function renderTabs() {
            const puzzle = currentPuzzle();
            const pState = getPuzzleState(puzzle);
            const maxUnlocked = maxUnlockedFrame(pState);
            const tabsEl = document.getElementById('frame-tabs');
            tabsEl.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'frame-tab';
                btn.textContent = String(i + 1);
                btn.disabled = i > maxUnlocked;

                if (pState.status === 'won' && i === pState.guesses.length - 1) {
                    btn.classList.add('solved');
                } else if (i < pState.guesses.length) {
                    btn.classList.add('missed');
                }

                if (i === state.activeFrame) {
                    btn.classList.add('active');
                }

                btn.addEventListener('click', () => setDisplayedFrame(i));
                tabsEl.appendChild(btn);
            }
        }

        function renderPopover() {
            const list = currentList();
            const idx = state.index[state.mode];
            const grid = document.getElementById('round-grid');
            grid.innerHTML = '';

            let wonCount = 0;
            list.forEach((p, i) => {
                const ps = state.progress[p.id];
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'round-cell';
                cell.textContent = String(i + 1);
                if (i === idx) cell.classList.add('current');
                if (ps && ps.status === 'won') {
                    cell.classList.add('won');
                    wonCount++;
                } else if (ps && ps.status === 'lost') {
                    cell.classList.add('lost');
                }
                cell.addEventListener('click', () => {
                    goToRound(i);
                    closePopover();
                });
                grid.appendChild(cell);
            });

            document.getElementById('popover-score').textContent = `${wonCount} / ${list.length} solved`;
        }

        function render() {
            const list = currentList();
            const puzzle = currentPuzzle();
            if (!puzzle) return;

            const idx = state.index[state.mode];
            const pState = getPuzzleState(puzzle);

            // Header state
            document.getElementById('mode-movies').classList.toggle('active', state.mode === 'movies');
            document.getElementById('mode-tv').classList.toggle('active', state.mode === 'tv');
            document.getElementById('round-picker-toggle').textContent = `${idx + 1} / ${list.length}`;
            document.getElementById('prev-round-btn').disabled = idx === 0;
            document.getElementById('next-round-btn').disabled = idx === list.length - 1;

            // Input vs Reveal state
            const guessBar = document.getElementById('guess-bar');
            const revealBox = document.getElementById('reveal-box');
            const input = document.getElementById('guess-input');
            input.placeholder = state.mode === 'movies' ? 'Search for a movie...' : 'Search for a TV show...';

            if (pState.status === 'playing') {
                guessBar.style.display = 'flex';
                revealBox.style.display = 'none';
            } else {
                guessBar.style.display = 'none';
                revealBox.style.display = 'flex';
                revealBox.className = `reveal-box ${pState.status}`;
                document.getElementById('reveal-title').textContent = decodeB64(puzzle.a);
                document.getElementById('reveal-sub').textContent = decodeB64(puzzle.s);
                const nextBtn = document.getElementById('reveal-next-btn');
                nextBtn.style.display = idx < list.length - 1 ? 'inline-block' : 'none';
            }

            // Guess chips (show missed guesses only)
            const trail = document.getElementById('guess-trail');
            trail.innerHTML = '';
            const wrongList = pState.status === 'won'
                ? pState.guesses.slice(0, -1)
                : pState.guesses;
            wrongList.forEach(g => {
                const chip = document.createElement('div');
                chip.className = 'guess-chip';
                chip.innerHTML = `<span class="mark">✕</span><span></span>`;
                chip.lastElementChild.textContent = g;
                trail.appendChild(chip);
            });

            // Preload & show appropriate frame
            const maxFrame = maxUnlockedFrame(pState);
            preloadFrames(puzzle, maxFrame);
            const targetFrame = pState.status === 'won'
                ? Math.max(0, pState.guesses.length - 1)
                : Math.min(5, pState.guesses.length);
            setDisplayedFrame(pState.status === 'lost' ? state.activeFrame : targetFrame);

            renderPopover();
        }

        function isCorrectGuess(rawGuess, puzzle) {
            const ng = normTitle(rawGuess);
            if (!ng) return false;
            const valid = [decodeB64(puzzle.a), ...(puzzle.al || []).map(decodeB64)];
            return valid.some(v => normTitle(v) === ng);
        }

        function submitGuess(isSkip = false) {
            const puzzle = currentPuzzle();
            if (!puzzle) return;
            const pState = getPuzzleState(puzzle);
            if (pState.status !== 'playing') return;

            const input = document.getElementById('guess-input');
            let val = isSkip ? '' : input.value.trim();

            // If user typed something and highlighted an autocomplete option, use it
            if (!isSkip && state.acHighlight >= 0 && state.acMatches[state.acHighlight]) {
                val = state.acMatches[state.acHighlight];
            }

            closeAutocomplete();
            input.value = '';

            if (!val && !isSkip) {
                // Treat empty submit cleanly as skip
                isSkip = true;
            }

            if (!isSkip && isCorrectGuess(val, puzzle)) {
                pState.guesses.push(decodeB64(puzzle.a));
                pState.status = 'won';
            } else {
                pState.guesses.push(isSkip ? 'Skipped' : val);
                if (pState.guesses.length >= 6) {
                    pState.status = 'lost';
                    state.activeFrame = 5;
                }
            }

            saveState();
            render();
        }

        function goToRound(newIdx) {
            const list = currentList();
            if (newIdx < 0 || newIdx >= list.length) return;
            state.index[state.mode] = newIdx;
            state.activeFrame = 0;
            closeAutocomplete();
            document.getElementById('guess-input').value = '';
            saveState();
            render();
        }

        function switchMode(newMode) {
            if (state.mode === newMode) return;
            state.mode = newMode;
            state.activeFrame = 0;
            closeAutocomplete();
            closePopover();
            document.getElementById('guess-input').value = '';
            saveState();
            render();
        }

        function updateAutocomplete() {
            const input = document.getElementById('guess-input');
            const box = document.getElementById('autocomplete');
            const q = normTitle(input.value);
            if (q.length < 1) {
                closeAutocomplete();
                return;
            }

            const catalog = currentCatalog();
            const starts = [];
            const wordStarts = [];
            const contains = [];

            for (const title of catalog) {
                const nt = normTitle(title);
                const ntNoThe = nt.startsWith('the ') ? nt.slice(4) : nt;
                if (nt.startsWith(q) || ntNoThe.startsWith(q)) {
                    starts.push(title);
                } else if (nt.includes(' ' + q)) {
                    wordStarts.push(title);
                } else if (nt.includes(q)) {
                    contains.push(title);
                }
            }

            state.acMatches = [...starts, ...wordStarts, ...contains].slice(0, 8);
            state.acHighlight = state.acMatches.length > 0 ? 0 : -1;

            if (state.acMatches.length === 0) {
                closeAutocomplete();
                return;
            }

            box.innerHTML = '';
            state.acMatches.forEach((m, i) => {
                const item = document.createElement('div');
                item.className = 'ac-item' + (i === state.acHighlight ? ' highlighted' : '');
                item.textContent = m;
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = m;
                    closeAutocomplete();
                    input.focus();
                });
                box.appendChild(item);
            });
            box.classList.add('open');
        }

        function refreshAcHighlight() {
            const items = document.querySelectorAll('#autocomplete .ac-item');
            items.forEach((el, i) => {
                el.classList.toggle('highlighted', i === state.acHighlight);
                if (i === state.acHighlight) {
                    el.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        function closeAutocomplete() {
            state.acMatches = [];
            state.acHighlight = -1;
            const box = document.getElementById('autocomplete');
            box.classList.remove('open');
            box.innerHTML = '';
        }

        function closePopover() {
            document.getElementById('round-popover').classList.remove('open');
        }

        function bindEvents() {
            document.getElementById('mode-movies').addEventListener('click', () => switchMode('movies'));
            document.getElementById('mode-tv').addEventListener('click', () => switchMode('tv'));
            document.getElementById('prev-round-btn').addEventListener('click', () => goToRound(state.index[state.mode] - 1));
            document.getElementById('next-round-btn').addEventListener('click', () => goToRound(state.index[state.mode] + 1));
            document.getElementById('reveal-next-btn').addEventListener('click', () => goToRound(state.index[state.mode] + 1));

            document.getElementById('round-picker-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('round-popover').classList.toggle('open');
            });

            document.getElementById('reset-mode-btn').addEventListener('click', () => {
                currentList().forEach(p => { delete state.progress[p.id]; });
                state.index[state.mode] = 0;
                state.activeFrame = 0;
                saveState();
                closePopover();
                render();
            });

            document.getElementById('submit-btn').addEventListener('click', () => submitGuess(false));
            document.getElementById('skip-btn').addEventListener('click', () => submitGuess(true));

            const input = document.getElementById('guess-input');
            input.addEventListener('input', updateAutocomplete);
            input.addEventListener('keydown', (e) => {
                const acOpen = document.getElementById('autocomplete').classList.contains('open');
                if (e.key === 'ArrowDown' && acOpen) {
                    e.preventDefault();
                    state.acHighlight = (state.acHighlight + 1) % state.acMatches.length;
                    refreshAcHighlight();
                } else if (e.key === 'ArrowUp' && acOpen) {
                    e.preventDefault();
                    state.acHighlight = (state.acHighlight - 1 + state.acMatches.length) % state.acMatches.length;
                    refreshAcHighlight();
                } else if (e.key === 'Tab' && acOpen && state.acHighlight >= 0) {
                    e.preventDefault();
                    input.value = state.acMatches[state.acHighlight];
                    closeAutocomplete();
                } else if (e.key === 'Escape') {
                    closeAutocomplete();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (acOpen && state.acHighlight >= 0 && normTitle(input.value) !== normTitle(state.acMatches[state.acHighlight])) {
                        input.value = state.acMatches[state.acHighlight];
                        closeAutocomplete();
                    } else {
                        submitGuess(false);
                    }
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrap')) closeAutocomplete();
                if (!e.target.closest('.round-nav')) closePopover();
            });

            document.addEventListener('keydown', (e) => {
                if (document.activeElement === input) return;
                const puzzle = currentPuzzle();
                if (!puzzle) return;
                const pState = getPuzzleState(puzzle);
                const maxUnlocked = maxUnlockedFrame(pState);

                if (e.key >= '1' && e.key <= '6') {
                    const f = Number(e.key) - 1;
                    if (f <= maxUnlocked) setDisplayedFrame(f);
                } else if (e.key === 'Enter' && pState.status !== 'playing') {
                    goToRound(state.index[state.mode] + 1);
                } else if (e.key === 'ArrowLeft') {
                    goToRound(state.index[state.mode] - 1);
                } else if (e.key === 'ArrowRight') {
                    goToRound(state.index[state.mode] + 1);
                }
            });
        }

        async function init() {
            loadSaved();
            bindEvents();
            try {
                const res = await fetch('jsons/halloween_framed.json');
                state.data = await res.json();
                render();
            } catch (err) {
                console.error('Failed to load game data:', err);
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
