        <ellipse cx="0" cy="0" rx="5.3" ry="4.1" fill="#ff9ebb" stroke="#243b2c" stroke-width="1.7"/>
        <circle cx="-1.85" cy="0.2" r="1.2" fill="#243b2c"/>
        <circle cx="1.85" cy="0.2" r="1.2" fill="#243b2c"/>
