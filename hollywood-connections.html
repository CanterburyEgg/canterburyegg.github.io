<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollywood Connections</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <script>(function(){try{if(localStorage.getItem('hc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    /* --- DESIGN TOKENS (shared with Melodle and The Hollywood Triangle) --- */
    :root {
        color-scheme: light;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

        --bg-canvas: #f5f3ee;
        --bg-canvas-accent: rgba(24, 24, 27, 0.035);
        --bg-surface: #ffffff;
        --bg-elevated: #ffffff;
        --bg-subtle: #efede7;
        --bg-slot: #faf9f6;
        --bg-hover: #e7e4dc;

        --border-subtle: #e2dfd6;
        --border-default: #d2cec3;
        --border-strong: #18181b;
        --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.05);
        --shadow-card: 0 10px 30px -10px rgba(24, 24, 27, 0.08), 0 2px 6px rgba(24, 24, 27, 0.04);
        --shadow-dropdown: 0 14px 32px -6px rgba(24, 24, 27, 0.16), 0 4px 10px rgba(24, 24, 27, 0.07);

        --text-primary: #18181b;
        --text-secondary: #5c5c66;
        --text-muted: #8c8c96;

        --accent: #18181b;
        --accent-hover: #2d2d33;
        --accent-fg: #ffffff;
        --accent-soft: rgba(24, 24, 27, 0.07);

        --err-fg: #dc2626; --err-bg: #fef2f2; --err-border: #fecaca;

        /* Tier colors: yellow, green, blue, purple */
        --tier-0-bg: #f6e3a0; --tier-0-fg: #4d3d00;
        --tier-1-bg: #bfe2b0; --tier-1-fg: #1f4a17;
        --tier-2-bg: #bcd5f0; --tier-2-fg: #173a63;
        --tier-3-bg: #d4c2ec; --tier-3-fg: #3d2470;

        --radius-md: 12px;
        --radius-lg: 18px;

        --giveup-bg: #a54848; --giveup-hover: #923c3c; --giveup-fg: #fff6f4;

        /* One board row (actor cards and solved rows): sized so header, 4 rows and controls fit the window */
        --row-h: clamp(68px, calc((100vh - 270px) / 4), 128px);
    }

    [data-theme="dark"] {
        color-scheme: dark;
        --bg-canvas: #111317;
        --bg-canvas-accent: rgba(255, 255, 255, 0.03);
        --bg-surface: #191c22;
        --bg-elevated: #20242c;
        --bg-subtle: #232730;
        --bg-slot: #1d2027;
        --bg-hover: #2c313c;

        --border-subtle: #2b303b;
        --border-default: #383e4c;
        --border-strong: #f2efe9;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
        --shadow-card: 0 16px 38px -10px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
        --shadow-dropdown: 0 18px 38px -6px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(0, 0, 0, 0.45);

        --text-primary: #f3f1ec;
        --text-secondary: #a0a5b5;
        --text-muted: #6b7182;

        --accent: #f3f1ec;
        --accent-hover: #dcd8cf;
        --accent-fg: #111317;
        --accent-soft: rgba(243, 241, 236, 0.11);

        --err-fg: #f87171; --err-bg: rgba(239, 68, 68, 0.13); --err-border: rgba(248, 113, 113, 0.32);
        --giveup-bg: #7c3434; --giveup-hover: #8d3c3c; --giveup-fg: #fbe9e6;

        --tier-0-bg: #5c4f1c; --tier-0-fg: #f8e7a8;
        --tier-1-bg: #2f5130; --tier-1-fg: #cdeec0;
        --tier-2-bg: #2b4566; --tier-2-fg: #cfe0f6;
        --tier-3-bg: #46356a; --tier-3-fg: #e3d6f7;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* Theme switches snap instantly: no transitions while swapping */
    html.theme-snap,
    html.theme-snap *,
    html.theme-snap *::before,
    html.theme-snap *::after {
        transition: none !important;
    }

    body {
        font-family: var(--font-sans);
        color: var(--text-primary);
        background-color: var(--bg-canvas);
        background-image: radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-canvas-accent), transparent);
        margin: 0;
        min-height: 100vh;
        padding: 20px;
        display: flex; /* lets .app's margin:auto center it vertically */
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    .app {
        width: 1040px;
        max-width: 100%;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
    }

    .surface {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
    }

    /* --- HEADER --- */
    header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
    }
    header h1 { grid-column: 2; text-align: center; }
    h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
    }
    .puzzle-number { color: var(--text-muted); font-weight: 700; margin-left: 6px; }
    .header-actions { grid-column: 3; justify-self: end; display: flex; gap: 6px; }

    .icon-btn {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        padding: 0;
        border-radius: 10px;
        background: var(--bg-subtle);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .icon-btn:hover { background: var(--bg-hover); border-color: var(--border-default); }
    .icon-btn:active { transform: translateY(1px); }
    .icon-btn svg { width: 17px; height: 17px; }

    /* --- GAME CARD --- */
    .game { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

    .lives {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 26px;
    }
    .lives-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-muted);
        margin-right: 4px;
    }
    .life {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .life.lost { background: var(--border-default); transform: scale(0.8); }

    .container { display: flex; flex-direction: column; gap: 8px; }
    #solved-section { display: flex; flex-direction: column; gap: 8px; }
    #solved-section:empty { display: none; }

    /* Solved rows, colored by difficulty tier */
    .solved-row {
        min-height: var(--row-h);
        justify-content: center;
        border-radius: var(--radius-md);
        padding: 10px 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 3px;
        animation: slideIn 0.35s ease-out;
    }
    .cat-0 { background: var(--tier-0-bg); color: var(--tier-0-fg); }
    .cat-1 { background: var(--tier-1-bg); color: var(--tier-1-fg); }
    .cat-2 { background: var(--tier-2-bg); color: var(--tier-2-fg); }
    .cat-3 { background: var(--tier-3-bg); color: var(--tier-3-fg); }
    .solved-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 23px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
    }
    .solved-actors { font-size: 18px; font-weight: 500; opacity: 0.85; }

    /* Actor grid */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid.shake { animation: shake 0.4s; }

    .card {
        height: var(--row-h);
        background: var(--bg-slot);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        overflow: hidden;
        user-select: none;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
    }
    .card:hover { border-color: var(--border-default); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .card img, .card .img-placeholder {
        width: var(--row-h);
        height: 100%;
        flex-shrink: 0;
        object-fit: cover;
        object-position: center 20%;
        display: block;
        background: var(--bg-subtle);
        pointer-events: none;
    }
    .card p {
        margin: 0;
        padding: 0 8px;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow-wrap: normal;
        word-break: keep-all;   /* never split a word; fitNames() shrinks the text instead */
        overflow: hidden;
        font-family: var(--font-display);
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.2;
        color: var(--text-primary);
    }
    .card.selected {
        background: var(--accent);
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: var(--shadow-card);
    }
    .card.selected p { color: var(--accent-fg); }
    .card.selected img { opacity: 0.9; }

    /* --- CONTROLS --- */
    .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .footer-row .lives { flex: 1; justify-content: center; }
    .btn {
        font-family: var(--font-display);
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--border-default);
        background: var(--bg-surface);
        color: var(--text-primary);
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-giveup { background: var(--giveup-bg); color: var(--giveup-fg); border-color: var(--giveup-bg); }
    .btn-giveup:hover { background: var(--giveup-hover); border-color: var(--giveup-hover); }
    .controls .btn-giveup { margin-left: 10px; }

    /* --- TOAST --- */
    #toast {
        position: fixed;
        top: 14%;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: var(--accent-fg);
        padding: 11px 22px;
        border-radius: 999px;
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 700;
        box-shadow: var(--shadow-dropdown);
        opacity: 0;
        pointer-events: none;
        z-index: 2000;
    }
    /* Rises in from below, holds, then floats out the top */
    #toast.show { animation: toastLife 2.2s ease forwards; }
    @keyframes toastLife {
        0%   { opacity: 0; transform: translate(-50%, 10px); }
        10%  { opacity: 1; transform: translate(-50%, 0); }
        82%  { opacity: 1; transform: translate(-50%, 0); }
        100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    /* --- ARCHIVE --- */
    #archive-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(17, 19, 23, 0.45);
        backdrop-filter: blur(4px);
        z-index: 1500;
        padding: 20px;
        overflow-y: auto;
    }
    .archive-panel {
        width: 520px;
        max-width: 100%;
        margin: 8vh auto 0;
        padding: 20px 22px 22px;
        animation: pop 0.2s ease;
    }
    .archive-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .archive-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }
    #archive-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
    .archive-day {
        height: 40px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-slot);
        color: var(--text-primary);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .archive-day:hover { background: var(--bg-hover); border-color: var(--border-default); }
    .archive-day.current { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* Give-up confirmation */
    #giveup-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(17, 19, 23, 0.45);
        backdrop-filter: blur(4px);
        z-index: 1600;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    #giveup-modal.open { display: flex; }
    .confirm-panel {
        width: 360px;
        max-width: 100%;
        padding: 24px 24px 20px;
        text-align: center;
        animation: pop 0.18s ease;
    }
    .confirm-panel h2 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }
    .confirm-panel p { margin: 0 0 18px; color: var(--text-secondary); font-size: 14px; }
    .confirm-actions { display: flex; gap: 8px; justify-content: center; }
    .confirm-actions .btn { flex: 1; }

    .load-error {
        padding: 12px 14px;
        border-radius: var(--radius-md);
        background: var(--err-bg);
        border: 1px solid var(--err-border);
        color: var(--err-fg);
        font-size: 14px;
        text-align: center;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
    @keyframes slideIn {
        from { transform: translateY(-12px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes pop {
        from { transform: scale(0.96); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 720px) {
        :root { --row-h: auto; }
        .card { height: auto; flex-direction: column; }
        .card img, .card .img-placeholder { width: 100%; height: auto; aspect-ratio: 4 / 5; }
        .card p { justify-content: center; text-align: center; padding: 7px 6px 8px; min-height: 44px; font-size: 12px; }
        .solved-title { font-size: 15px; }
        .solved-actors { font-size: 13px; }
        .footer-row { justify-content: center; }
        .controls .btn-giveup { margin-left: 0; }
    }

    @media (max-width: 480px) {
        body { padding: 10px; }
        .game { padding: 12px; }
        h1 { font-size: 18px; }
        .grid, .container, #solved-section { gap: 6px; }
        .card p { font-size: 10.5px; min-height: 38px; padding: 5px 4px 6px; }
        .btn { padding: 0 14px; }
    }
    </style>
</head>
<body>

<div class="app">
    <header class="surface">
        <h1 id="puzzle-title">Hollywood Connections</h1>
        <div class="header-actions">
            <button id="calendar-btn" class="icon-btn" onclick="toggleArchive()" aria-label="Archive">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </button>
            <button id="btn-theme" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
        </div>
    </header>

    <main class="game surface">
        <div class="container" id="game-container">
            <div id="solved-section"></div>
            <div id="board" class="grid"></div>
        </div>

        <div class="footer-row">
            <div class="lives" id="lives-display"><span class="lives-label">Mistakes remaining</span><span id="dots"></span></div>

            <div class="controls" id="game-controls">
                <button class="btn" onclick="shuffleGrid()">Shuffle</button>
                <button class="btn" onclick="deselect()">Deselect All</button>
                <button id="submit-btn" class="btn btn-primary" onclick="checkGuess()">Submit</button>
                <button id="giveup-btn" class="btn btn-giveup" onclick="giveUp()">Give Up</button>
            </div>
        </div>
    </main>
</div>

<div id="archive-overlay" onclick="if (event.target === this) toggleArchive()">
    <div class="archive-panel surface">
        <div class="archive-head">
            <h2>Archive</h2>
            <button class="icon-btn" onclick="toggleArchive()" aria-label="Close archive">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div id="archive-list"></div>
    </div>
</div>

<div id="giveup-modal" onclick="if (event.target === this) closeGiveUp()">
    <div class="confirm-panel surface" role="dialog" aria-modal="true" aria-labelledby="giveup-title">
        <h2 id="giveup-title">Give up?</h2>
        <p>The remaining groups will be revealed.</p>
        <div class="confirm-actions">
            <button class="btn" onclick="closeGiveUp()">Cancel</button>
            <button class="btn btn-giveup" onclick="confirmGiveUp()">Confirm</button>
        </div>
    </div>
</div>

<div id="toast">One away...</div>

<script>
    const START_DATE = new Date("2026-01-01T00:00:00Z");
    const TMDB_BASE = "https://image.tmdb.org/t/p/w500";
    
    let allPuzzles = [];
    let currentPuzzle = [];
    let solvedCategories = [];
    let activeActors = [];
    let selection = [];
    let lives = 4;
    let isGameOver = false;
    let currentDayIdx = 0;

    async function init() {
        try {
            const res = await fetch('jsons/puzzle_batch.json');
            if (!res.ok) throw new Error("HTTP error " + res.status);
            allPuzzles = await res.json();
            loadByDay(new Date());
        } catch (e) { 
            console.error("Critical Failure:", e);
            document.getElementById('game-container').innerHTML = `<div class="load-error">Couldn't load today's puzzle. Check the console for details.</div>`;
        }
    }

    function loadByDay(date) {
        const diff = Math.floor((date - START_DATE) / (1000 * 60 * 60 * 24));
        const idx = Math.abs(diff % allPuzzles.length);
        currentPuzzle = allPuzzles[idx];
        
        currentDayIdx = diff;
        document.getElementById('puzzle-title').innerHTML = `Hollywood Connections <span class="puzzle-number">#${diff + 1}</span>`;
        document.getElementById('archive-overlay').style.display = 'none';
        document.getElementById('game-controls').style.display = 'flex';
        document.getElementById('lives-display').style.visibility = 'visible';
        
        lives = 4;
        isGameOver = false;
        solvedCategories = [];
        activeActors = currentPuzzle.flatMap(cat => cat.actors);
        shuffleArray(activeActors);
        
        updateLives();
        renderGame();

        const today = new Date();
        const realDiff = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24));
        renderArchiveList(realDiff);
    }

    // Short, NYT-style labels: no colons, no quotes. Applied at display time so archive puzzles match.
    function displayTitle(cat) {
        const t = cat.title;
        let m;
        if (cat.subtype === 'cameos') return `Guest-Starred on ${t}`;
        if (cat.subtype === 'directorial_muses') return `${t} Regulars`;
        if ((m = t.match(/^In the movie '(.+)'$/))) return m[1];
        if ((m = t.match(/^In the TV show '(.+)'$/))) return m[1];
        if ((m = t.match(/^First Name: (.+)$/))) return `${m[1]} ___`;
        if ((m = t.match(/^Last Name: (.+)$/))) return `___ ${m[1]}`;
        if ((m = t.match(/^Initials: ([A-Za-z]+)$/))) return `Initials ${m[1].split('').join('.')}.`;
        if ((m = t.match(/^Famously Played an? '(.+)'$/))) return `Played a Famous ${m[1]}`;
        if ((m = t.match(/^Names containing '(.+)'$/))) return `${m[1]} in the Name`;
        if ((m = t.match(/^In an? (.+) Movie$/))) return `${m[1]} Movies`;
        if ((m = t.match(/^Voiced an? (.+) Character$/))) return `${m[1]} Voice Cast`;
        return t.replace(/: /g, ' ');
    }

    function renderGame() {
        const board = document.getElementById('board');
        const solvedSection = document.getElementById('solved-section');
        board.innerHTML = '';
        solvedSection.innerHTML = '';
        selection = [];

        solvedCategories.forEach((cat, index) => { 
            const row = document.createElement('div');
            // Color by difficulty tier (0 yellow ... 3 purple); older puzzles without a tier fall back to solve order
            row.className = `solved-row cat-${cat.tier ?? index}`;
            row.innerHTML = `<div class="solved-title">${displayTitle(cat)}</div><div class="solved-actors">${cat.actors.map(a=>a.name).join(', ')}</div>`;
            solvedSection.appendChild(row);
        });

        const solvedNames = solvedCategories.flatMap(c => c.actors.map(a => a.name));
        const remaining = activeActors.filter(a => !solvedNames.includes(a.name));
        
        remaining.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            const imgPath = a.profile_path ? TMDB_BASE + a.profile_path : '';
            const imgHTML = imgPath ? `<img src="${imgPath}" alt="">` : `<div class="img-placeholder"></div>`;
            
            card.innerHTML = `${imgHTML}<p>${a.name}</p>`;
            card.onclick = () => {
                if (isGameOver) return;
                if (card.classList.contains('selected')) {
                    card.classList.remove('selected');
                    selection = selection.filter(n => n !== a.name);
                } else if (selection.length < 4) {
                    card.classList.add('selected');
                    selection.push(a.name);
                }
            };
            board.appendChild(card);
        });
        fitNames();
    }

    // Shrink any name whose longest word (or total height) doesn't fit its box, instead of wrapping mid-word
    function fitNames() {
        document.querySelectorAll('.card p').forEach(p => {
            p.style.fontSize = '';
            let size = parseFloat(getComputedStyle(p).fontSize);
            while (size > 9 && (p.scrollWidth > p.clientWidth + 1 || p.scrollHeight > p.clientHeight + 1)) {
                size -= 0.5;
                p.style.fontSize = size + 'px';
            }
        });
    }
    window.addEventListener('resize', fitNames);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);

    function checkGuess() {
        if (selection.length !== 4 || isGameOver) return;

        const found = currentPuzzle.find(cat => 
            cat.actors.every(actorObj => selection.includes(actorObj.name))
        );

        if (found) {
            solvedCategories.push(found);
            renderGame();
            if (solvedCategories.length === 4) showToast("Puzzle Complete!");
        } else {
            currentPuzzle.forEach(cat => {
                const matchCount = cat.actors.filter(a => selection.includes(a.name)).length;
                if (matchCount === 3) showToast("One away...");
            });

            lives--;
            updateLives();
            const board = document.getElementById('board');
            board.classList.add('shake');
            setTimeout(() => board.classList.remove('shake'), 400);
            
            if (lives <= 0) endGame();
        }
    }

    async function endGame() {
        isGameOver = true;
        showToast("Game Over");
        document.getElementById('game-controls').style.display = 'none';
        document.getElementById('lives-display').style.visibility = 'hidden';
        
        // Find categories not yet solved
        const solvedTitles = solvedCategories.map(c => c.title);
        const remainingCats = currentPuzzle.filter(cat => !solvedTitles.includes(cat.title));

        // Reveal remaining categories with a delay
        for (const cat of remainingCats) {
            await new Promise(resolve => setTimeout(resolve, 1000));
            solvedCategories.push(cat);
            renderGame();
        }
    }

    // Give Up opens a confirmation modal
    function giveUp() {
        if (isGameOver) return;
        document.getElementById('giveup-modal').classList.add('open');
    }
    function closeGiveUp() {
        document.getElementById('giveup-modal').classList.remove('open');
    }
    function confirmGiveUp() {
        closeGiveUp();
        endGame();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGiveUp(); });

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.remove('show');
        void t.offsetWidth;          // restart the animation if a toast is already showing
        t.classList.add('show');
    }

    function updateLives() {
        const dots = document.getElementById('dots');
        dots.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const d = document.createElement('span');
            d.className = 'life' + (i >= lives ? ' lost' : '');
            dots.appendChild(d);
        }
        dots.style.display = 'inline-flex';
        dots.style.gap = '6px';
    }

    function shuffleGrid() {
        const solvedNames = solvedCategories.flatMap(c => c.actors.map(a => a.name));
        let remaining = activeActors.filter(a => !solvedNames.includes(a.name));
        shuffleArray(remaining);
        activeActors = [...solvedCategories.flatMap(c => c.actors), ...remaining];
        renderGame();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function deselect() {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        selection = [];
    }

    function toggleArchive() {
        const over = document.getElementById('archive-overlay');
        over.style.display = over.style.display === 'block' ? 'none' : 'block';
    }

    function renderArchiveList(max) {
        const list = document.getElementById('archive-list');
        list.innerHTML = '';
        for (let i = 0; i <= max; i++) {
            const d = document.createElement('button');
            d.className = 'archive-day' + (i === currentDayIdx ? ' current' : '');
            d.innerText = i + 1;
            d.onclick = () => {
                let t = new Date(START_DATE);
                t.setDate(t.getDate() + i);
                loadByDay(t);
            };
            list.appendChild(d);
        }
    }

    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

    // Theme switches snap instantly (no fades), per the repo's theme rule
    function toggleTheme() {
        const root = document.documentElement;
        const dark = root.getAttribute('data-theme') !== 'dark';
        root.classList.add('theme-snap');
        if (dark) root.setAttribute('data-theme', 'dark');
        else root.removeAttribute('data-theme');
        void root.offsetHeight;
        requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-snap')));
        try { localStorage.setItem('hc-theme', dark ? 'dark' : 'light'); } catch (e) {}
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.getElementById('btn-theme').innerHTML = dark ? ICON_SUN : ICON_MOON;
    }

    updateThemeIcon();
    init();
</script>
</body>
</html>
