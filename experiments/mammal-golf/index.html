<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mammal Golf</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <style>
        :root {
            --bg: #94a3b8;
            --card-bg: #2d2f31;
            --primary: #52b788;
            --primary-bright: #74c69d;
            --text-main: #e2e2e2;
            --text-muted: #9ba1a6;
            --border: #3f4245;
            --input-bg: #111214;
            --danger: #e63946;
            --success: #2d6a4f;
            --all-in: #f4a261;
            --gold: #d4af37;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 36px 16px;
            margin: 0;
        }

        #game-container {
            background-color: var(--card-bg);
            padding: 36px 36px 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 980px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        #calendar-trigger, #free-play-trigger {
            position: absolute;
            top: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        #calendar-trigger { right: 20px; }
        #free-play-trigger { right: 60px; }
        #calendar-trigger:hover, #free-play-trigger:hover { transform: scale(1.1); }
        #calendar-trigger img, #free-play-trigger img { width: 28px; height: 28px; display: block; opacity: 0.85; }

        h1 {
            margin: 0 0 6px 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 22px;
        }

        /* Scorecard bar */
        .scorecard-bar {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 12px;
            margin-bottom: 22px;
        }

        .score-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-right: 1px solid var(--border);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .score-pill:last-child { border-right: none; }
        .score-pill span.val {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
        }
        .score-pill span.val.accent { color: var(--primary); }
        .score-pill span.val.gold { color: var(--gold); }

        /* Input Row */
        .input-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        #main-input {
            padding: 14px 18px;
            width: 100%;
            max-width: 440px;
            font-size: 1.15rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: #fff;
            outline: none;
            text-align: center;
            transition: border-color 0.15s;
        }
        #main-input:focus {
            border-color: var(--primary);
        }
        #main-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .swing-btn {
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #111;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }
        .swing-btn:hover:not(:disabled) {
            background: var(--primary-bright);
            transform: translateY(-1px);
        }
        .swing-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Feedback Toast */
        #feedback-banner {
            min-height: 26px;
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
            transition: opacity 0.2s;
        }
        .fb-hit { color: var(--primary-bright); }
        .fb-warn { color: var(--all-in); }
        .fb-miss { color: var(--danger); }

        /* 3x3 Category Grid */
        .golf-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 10px 0 24px;
            text-align: left;
        }

        @media (max-width: 740px) {
            .golf-grid { grid-template-columns: 1fr; }
            #game-container { padding: 24px 16px; }
        }

        .cat-card {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 148px;
            position: relative;
            transition: border-color 0.2s, background-color 0.2s, transform 0.15s;
        }

        .cat-card.clickable {
            cursor: pointer;
        }
        .cat-card.clickable:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .cat-card.cleared {
            background: linear-gradient(160deg, rgba(45, 106, 79, 0.38) 0%, rgba(17, 18, 20, 0.95) 100%);
            border-color: var(--primary);
        }

        .cat-card.flash-hit {
            animation: cardPulse 0.65s ease;
        }

        @keyframes cardPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(82, 183, 136, 0.7); }
            40% { transform: scale(1.025); box-shadow: 0 0 0 10px rgba(82, 183, 136, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(82, 183, 136, 0); }
        }

        .cat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
        }

        .group-badge {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-muted);
        }
        .group-taxonomy { color: #93c5fd; background: rgba(59, 130, 246, 0.15); }
        .group-geography { color: #fcd34d; background: rgba(245, 158, 11, 0.15); }
        .group-conservation { color: #fca5a5; background: rgba(239, 68, 68, 0.15); }
        .group-biology { color: #86efac; background: rgba(34, 197, 94, 0.15); }
        .group-name { color: #d8b4fe; background: rgba(168, 85, 247, 0.15); }

        .cat-count {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cat-title {
            font-size: 1.04rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 6px 0;
            line-height: 1.25;
        }

        .cat-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.35;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .cat-hits {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 24px;
            align-items: center;
        }

        .hit-chip {
            font-size: 0.73rem;
            font-weight: 700;
            background: var(--primary);
            color: #0b1b13;
            padding: 3px 9px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .unhit-label {
            font-size: 0.72rem;
            color: #5d6368;
            font-style: italic;
        }

        /* Stroke Log & Post-Game Panel */
        .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        .strokes-log {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .stroke-badge {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.83rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .stroke-badge .s-num {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .stroke-badge .s-name {
            color: #fff;
            font-weight: 700;
        }
        .stroke-badge .s-cnt {
            background: rgba(82, 183, 136, 0.2);
            color: var(--primary-bright);
            font-weight: 800;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 99px;
        }

        /* Result & Optimal Par Box */
        #result-panel {
            background: var(--input-bg);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 20px 24px;
            text-align: center;
        }

        .golf-rating {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .golf-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .optimal-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: left;
            margin-top: 10px;
        }

        .optimal-title {
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .opt-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .opt-row:last-child { margin-bottom: 0; }

        .opt-mammal {
            font-weight: 800;
            color: #fff;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .opt-cats {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 9px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: all 0.15s;
        }
        .secondary-btn:hover {
            border-color: var(--text-main);
            color: #fff;
        }
        .secondary-btn.danger:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }
        .picker-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .picker-box h2 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .game-num-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.12s;
            font-size: 0.95rem;
        }
        .game-num-btn small {
            font-size: 0.62rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }
        .game-num-btn:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: #111;
        }
        .game-num-btn:hover small { color: #111; }
        .game-num-btn.active {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mammal-list-modal {
            max-width: 580px;
            text-align: left;
        }
        .mammal-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            max-height: 360px;
            overflow-y: auto;
            padding: 4px 2px;
        }
        .mammal-chip {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.8rem;
            color: var(--text-main);
        }
        .mammal-chip.guessed {
            border-color: var(--primary);
            color: var(--primary-bright);
            font-weight: 700;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="free-play-trigger" onclick="startFreePlay()" title="Generate Random Course">
        <img src="../../img/free.png" alt="Free Play">
    </div>

    <div id="calendar-trigger" onclick="openPicker()" title="Select Course">
        <img src="../../img/calendar.png" alt="Select Course">
    </div>

    <h1>MAMMAL GOLF</h1>
    <div class="subtitle">Name as few mammals as possible to clear all 6 undeniable categories &mdash; every board has a 1-stroke Hole-in-One!</div>

    <div class="scorecard-bar">
        <div class="score-pill">Course <span class="val" id="course-num">#1</span></div>
        <div class="score-pill">Par <span class="val gold" id="course-par">2</span></div>
        <div class="score-pill">Strokes <span class="val accent" id="stroke-count">0</span></div>
        <div class="score-pill">Cleared <span class="val" id="cleared-count">0 / 6</span></div>
    </div>

    <div class="input-row">
        <input type="text" id="main-input" placeholder="Enter a mammal (e.g. Giraffe, Sea otter, Lion)..." autocomplete="off">
        <button class="swing-btn" id="swing-btn" onclick="submitMammal()">Swing</button>
    </div>

    <div id="feedback-banner"></div>

    <div class="golf-grid" id="golf-grid"></div>

    <div class="bottom-area">
        <div class="strokes-log" id="strokes-log"></div>

        <div id="result-panel" class="hidden">
            <div class="golf-rating" id="golf-rating-title">PAR!</div>
            <div class="golf-sub" id="golf-rating-sub"></div>
            <div class="optimal-box" id="optimal-box"></div>
        </div>

        <div class="controls-row">
            <button class="secondary-btn" onclick="resetCurrentCourse()">Reset Hole</button>
            <button class="secondary-btn danger" id="give-up-btn" onclick="giveUpHole()">Give Up &amp; Show Hole-in-One</button>
            <button class="secondary-btn" onclick="nextCourse()">Next Hole &rarr;</button>
        </div>
    </div>
</div>

<!-- Course Picker Modal -->
<div id="picker-modal" class="modal hidden" onclick="closePicker()">
    <div class="picker-box" onclick="event.stopPropagation()">
        <h2>Select Golf Course</h2>
        <div class="game-grid" id="game-grid"></div>
    </div>
</div>

<!-- Category Mammal Inspector Modal -->
<div id="inspector-modal" class="modal hidden" onclick="closeInspector()">
    <div class="picker-box mammal-list-modal" onclick="event.stopPropagation()">
        <h2 id="insp-title" style="color:#fff; font-size:1.1rem; margin-bottom:4px;">Category</h2>
        <div id="insp-desc" style="color:var(--text-muted); font-size:0.83rem; margin-bottom:14px;"></div>
        <div class="mammal-chips" id="insp-chips"></div>
    </div>
</div>

function normalizeStr(s) {
    return (s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['’`-]/g, " ")
        .replace(/[^a-z0-9 ]+/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function editDistance(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 99;
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
            dp[i][j] = a[i - 1] === b[j - 1]
                ? dp[i - 1][j - 1]
                : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
    }
    return dp[a.length][b.length];
}

function scoreMammalOnCurrentBoard(m) {
    const activeCats = currentBoard.categories;
    let newHits = 0;
    let totalHits = 0;
    for (const c of activeCats) {
        if (m.traits.includes(c)) {
            totalHits++;
            if (!clearedCats.has(c)) newHits++;
        }
    }
    return { newHits, totalHits, views: m.views_60d || 0 };
}

function findBestMammalMatch(rawQuery) {
    const q = normalizeStr(rawQuery);
    if (!q) return null;

    // 1. Check if the query is a generic group term (like "bear", "whale", "rhino", "fox")
    // AND also check exact canonical/alias matches; collect all candidate species and pick the one
    // that clears the most new categories on the current board!
    const candidates = new Map();

    if (GENERIC_GROUP_TERMS[q]) {
        for (const cName of GENERIC_GROUP_TERMS[q]) {
            const found = DB.mammals.find(m => m.name === cName);
            if (found) candidates.set(found.name, found);
        }
    }

    for (const m of DB.mammals) {
        const nNorm = normalizeStr(m.name);
        if (nNorm === q) {
            // Exact canonical name match: if not a generic group word, return immediately
            if (!GENERIC_GROUP_TERMS[q]) return m;
            candidates.set(m.name, m);
        }
        for (const al of (m.aliases || [])) {
            if (normalizeStr(al) === q) {
                candidates.set(m.name, m);
            }
        }
    }

    if (candidates.size > 0) {
        const list = Array.from(candidates.values());
        list.sort((a, b) => {
            const sa = scoreMammalOnCurrentBoard(a);
            const sb = scoreMammalOnCurrentBoard(b);
            if (sb.newHits !== sa.newHits) return sb.newHits - sa.newHits;
            if (sb.totalHits !== sa.totalHits) return sb.totalHits - sa.totalHits;
            return sb.views - sa.views;
        });
        return list[0];
    }

    // 2. Fuzzy 1-edit-distance match (for words >= 4 chars)
    if (q.length >= 4) {
        let bestMammal = null;
        let bestDist = 99;
        for (const m of DB.mammals) {
            const allNames = [m.name, ...(m.aliases || [])];
            for (const nm of allNames) {
                const norm = normalizeStr(nm);
                const d = editDistance(q, norm);
                const maxAllowed = norm.length >= 7 ? 2 : 1;
                if (d <= maxAllowed && d < bestDist) {
                    bestDist = d;
                    bestMammal = m;
                }
            }
        }
        if (bestMammal) return bestMammal;
    }

    return null;
}

function initDatabase(data) {
    if (data.mammals_packed && !data.mammals) {
        const catIds = data.categories.map(c => c.id);
        data.mammals = data.mammals_packed.map(row => {
            const [name, maskOrIdxs, views_60d, aliases] = row;
            const traits = Array.isArray(maskOrIdxs)
                ? maskOrIdxs.map(idx => catIds[idx]).filter(Boolean)
                : catIds.filter((_, i) => (maskOrIdxs & (1 << i)) !== 0);
            return { name, traits, views_60d, aliases: aliases || [] };
        });
    }
    DB = data;
    catMap = {};
    for (const c of DB.categories) {
        const matching = DB.mammals.filter(m => m.traits.includes(c.id));
        catMap[c.id] = { ...c, count: matching.length, mammals: matching };
    }
    buildCoursePicker();
    loadCourse(0);
}

function buildCoursePicker() {
    const grid = document.getElementById("game-grid");
    grid.innerHTML = "";
    DB.boards.forEach((b, idx) => {
        const btn = document.createElement("div");
        btn.className = "game-num-btn" + (idx === currentCourseIdx && !isFreePlay ? " active" : "");
        btn.innerHTML = `<span>#${b.id}</span><small>PAR ${b.par}</small>`;
        btn.onclick = () => {
            isFreePlay = false;
            loadCourse(idx);
            closePicker();
        };
        grid.appendChild(btn);
    });
}

function loadCourse(idx) {
    currentCourseIdx = idx;
    currentBoard = DB.boards[idx];
    resetCurrentCourse();
    buildCoursePicker();
}

function resetCurrentCourse() {
    strokes = [];
    clearedCats = new Set();
    holeFinished = false;

    document.getElementById("course-num").textContent = isFreePlay ? "FREE" : `#${currentBoard.id}`;
    document.getElementById("course-par").textContent = currentBoard.par;
    document.getElementById("main-input").disabled = false;
    document.getElementById("swing-btn").disabled = false;
    document.getElementById("give-up-btn").classList.remove("hidden");
    document.getElementById("result-panel").classList.add("hidden");
    setFeedback("", "");

    renderBoard([]);
    renderScorecard();
    document.getElementById("main-input").focus();
}

function setFeedback(msg, cls) {
    const el = document.getElementById("feedback-banner");
    el.className = cls || "";
    el.textContent = msg;
}

function renderScorecard() {
    const totalCats = currentBoard ? currentBoard.categories.length : 6;
    document.getElementById("stroke-count").textContent = strokes.length;
    document.getElementById("cleared-count").textContent = `${clearedCats.size} / ${totalCats}`;

    const logEl = document.getElementById("strokes-log");
    logEl.innerHTML = "";
    strokes.forEach((s, i) => {
        const badge = document.createElement("div");
        badge.className = "stroke-badge";
        badge.innerHTML = `
            <span class="s-num">Stroke ${i + 1}</span>
            <span class="s-name">${s.mammal.name}</span>
            <span class="s-cnt">${s.hitCats.length} hit</span>
        `;
        logEl.appendChild(badge);
    });
}

function renderBoard(newlyHitCatIds = []) {
    const grid = document.getElementById("golf-grid");
    grid.innerHTML = "";

    for (const catId of currentBoard.categories) {
        const cat = catMap[catId];
        const isCleared = clearedCats.has(catId);
        const card = document.createElement("div");
        const flashClass = newlyHitCatIds.includes(catId) ? " flash-hit" : "";
        const clickClass = holeFinished ? " clickable" : "";
        card.className = `cat-card${isCleared ? " cleared" : ""}${flashClass}${clickClass}`;

        if (holeFinished) {
            card.onclick = () => openInspector(catId);
        }

        const hittingMammals = strokes
            .filter(s => s.hitCats.includes(catId))
            .map(s => s.mammal.name);

        const hitsHtml = hittingMammals.length > 0
            ? hittingMammals.map(nm => `<span class="hit-chip">&#10003; ${nm}</span>`).join("")
            : `<span class="unhit-label">${holeFinished ? "Click to view all " + cat.count + " mammals" : "Uncovered"}</span>`;

        card.innerHTML = `
            <div>
                <div class="cat-top">
                    <span class="group-badge group-${cat.group}">${cat.group}</span>
                    <span class="cat-count">${cat.count} mammals</span>
                </div>
                <h3 class="cat-title">${cat.name}</h3>
                <div class="cat-desc">${cat.desc}</div>
            </div>
            <div class="cat-hits">${hitsHtml}</div>
        `;
        grid.appendChild(card);
    }
}

function submitMammal() {
    if (holeFinished) return;
    const input = document.getElementById("main-input");
    const raw = input.value.trim();
    if (!raw) return;

    const mammal = findBestMammalMatch(raw);
    if (!mammal) {
        setFeedback(`"${raw}" isn't in our verified mammal roster (try a specific common name like "Gray wolf" or "Capybara").`, "fb-miss");
        return;
    }

    if (strokes.some(s => s.mammal.name === mammal.name)) {
        setFeedback(`You already played ${mammal.name} on this hole!`, "fb-warn");
        input.value = "";
        return;
    }

    const totalCats = currentBoard.categories.length;
    const hitCats = currentBoard.categories.filter(cid => mammal.traits.includes(cid));
    const newCats = hitCats.filter(cid => !clearedCats.has(cid));

    if (newCats.length === 0) {
        if (hitCats.length === 0) {
            setFeedback(`${mammal.name} doesn't match any of the ${totalCats} categories on this board (No stroke penalty).`, "fb-warn");
        } else {
            setFeedback(`${mammal.name} only matches categories you've already cleared (No stroke penalty).`, "fb-warn");
        }
        input.value = "";
        return;
    }

    strokes.push({ mammal, hitCats, newCats });
    newCats.forEach(cid => clearedCats.add(cid));
    input.value = "";

    let comboLabel;
    if (newCats.length === totalCats && strokes.length === 1) {
        comboLabel = `🏆 ${mammal.name.toUpperCase()} — ${totalCats}-FOR-${totalCats} HOLE-IN-ONE!!`;
    } else if (newCats.length >= 3) {
        comboLabel = `🔥 ${mammal.name.toUpperCase()} — ${hitCats.length}-CATEGORY SWING! (+${newCats.length} new)`;
    } else {
        comboLabel = `${mammal.name} cleared ${newCats.length} new categor${newCats.length === 1 ? "y" : "ies"} (${hitCats.length} total on board)!`;
    }
    setFeedback(comboLabel, "fb-hit");

    renderScorecard();
    renderBoard(newCats);

    if (clearedCats.size === totalCats) {
        finishHole(false);
    }
}

function finishHole(gaveUp) {
    holeFinished = true;
    document.getElementById("main-input").disabled = true;
    document.getElementById("swing-btn").disabled = true;
    document.getElementById("give-up-btn").classList.add("hidden");

    const panel = document.getElementById("result-panel");
    const titleEl = document.getElementById("golf-rating-title");
    const subEl = document.getElementById("golf-rating-sub");
    const optBox = document.getElementById("optimal-box");

    panel.classList.remove("hidden");

    const totalCats = currentBoard.categories.length;
    const par = currentBoard.par;
    const s = strokes.length;

    if (gaveUp) {
        titleEl.textContent = "HOLE CONCEDED";
        titleEl.style.color = "var(--danger)";
        subEl.textContent = `You cleared ${clearedCats.size} of ${totalCats} categories in ${s} stroke${s === 1 ? "" : "s"}. Click any category card above to explore all valid mammals!`;
    } else {
        const diff = s - par;
        let rating = "PAR!";
        let color = "var(--primary-bright)";
        if (s === 1) { rating = "🏆 HOLE-IN-ONE! (-1)"; color = "var(--gold)"; }
        else if (diff <= -2) { rating = "🦅 EAGLE! (" + diff + ")"; color = "var(--gold)"; }
        else if (diff === -1) { rating = "🐦 BIRDIE! (-1)"; color = "var(--gold)"; }
        else if (diff === 0) { rating = "⛳ EVEN PAR!"; color = "var(--primary-bright)"; }
        else if (diff === 1) { rating = "BOGEY (+1)"; color = "var(--all-in)"; }
        else if (diff === 2) { rating = "DOUBLE BOGEY (+2)"; color = "var(--all-in)"; }
        else { rating = `+${diff} OVER PAR`; color = "var(--danger)"; }

        titleEl.textContent = rating;
        titleEl.style.color = color;
        subEl.textContent = `Cleared all ${totalCats} categories in ${s} stroke${s === 1 ? "" : "s"} on a Par ${par} course. Click any category card above to inspect all valid mammals!`;
    }

    // Find all 1-stroke Hole-in-One mammals for this 6-category board
    const hioMammals = DB.mammals.filter(m =>
        currentBoard.categories.every(cid => m.traits.includes(cid))
    );
    let rowsHtml = "";
    if (hioMammals.length > 0) {
        rowsHtml += `<div class="optimal-title">🏆 1-Stroke Hole-in-One Mammal${hioMammals.length > 1 ? "s (" + hioMammals.length + ")" : " (Unique 1-of-1!)"}</div>`;
        for (const m of hioMammals) {
            rowsHtml += `
                <div class="opt-row">
                    <span class="opt-mammal" style="color: var(--gold);">&#9733; ${m.name}</span>
                    <span class="opt-cats">&rarr; Clears all ${totalCats} categories in 1 stroke!</span>
                </div>
            `;
        }
    }

    // Also show a 2-stroke Even Par pair
    const solNames = currentBoard.sample_solution || [];
    if (solNames.length > 0) {
        rowsHtml += `<div class="optimal-title" style="margin-top: 10px;">⛳ Sample 2-Stroke Even Par Pair</div>`;
        for (const nm of solNames) {
            const m = DB.mammals.find(x => x.name === nm);
            if (!m) continue;
            const covered = currentBoard.categories
                .filter(cid => m.traits.includes(cid))
                .map(cid => catMap[cid].name);
            rowsHtml += `
                <div class="opt-row">
                    <span class="opt-mammal">${m.name}</span>
                    <span class="opt-cats">&rarr; ${covered.join(" • ")} (${covered.length})</span>
                </div>
            `;
        }
    }
    optBox.innerHTML = rowsHtml;

    renderBoard([]);
}

function giveUpHole() {
    if (holeFinished) return;
    finishHole(true);
}

function nextCourse() {
    if (isFreePlay) {
        startFreePlay();
    } else {
        const nextIdx = (currentCourseIdx + 1) % DB.boards.length;
        loadCourse(nextIdx);
    }
}

function areCategoriesOrthogonalClient(chosen) {
    const s = new Set(chosen);
    if (s.has("aquatic_semiaquatic") && s.has("terrestrial_only")) return false;
    if (s.has("single_continent") && s.has("multi_continent")) return false;
    if (s.has("name_single_word") && s.has("name_multi_word")) return false;

    if (s.has("fully_marine") && (s.has("aquatic_semiaquatic") || s.has("multi_continent"))) return false;
    if ((s.has("family_felidae") || s.has("family_canidae")) && s.has("order_carnivora")) return false;
    if (s.has("family_felidae") && s.has("diet_carnivore")) return false;
    if (s.has("odd_toed_ungulate") && (s.has("ungulate") || s.has("diet_herbivore"))) return false;
    if (s.has("horns_antlers_tusks") && s.has("ungulate")) return false;
    if (s.has("name_short_5") && s.has("name_single_word")) return false;
    if (s.has("name_has_color") && s.has("name_multi_word")) return false;
    if (s.has("name_has_geo") && s.has("name_multi_word")) return false;

    const taxCats = ["order_carnivora", "family_felidae", "family_canidae", "order_rodentia", "order_primates", "ungulate", "odd_toed_ungulate", "marsupial_monotreme", "fully_marine"];
    const dietCats = ["diet_herbivore", "diet_carnivore", "diet_insectivore", "diet_omnivore"];
    const weightCats = ["weight_over_200kg", "weight_medium", "weight_under_5kg"];
    const continentCats = ["native_africa", "native_asia", "native_north_america", "native_south_america", "native_europe", "native_australia"];

    const countIn = grp => grp.filter(x => s.has(x)).length;
    if (countIn(taxCats) > 1) return false;
    if (countIn(dietCats) > 1) return false;
    if (countIn(weightCats) > 1) return false;
    if (countIn(continentCats) > 1 && s.has("single_continent")) return false;
    if (countIn(continentCats) > 2) return false;
    return true;
}

// Client-side solver for 6-Category Par 2 + 1-Stroke Hole-in-One Free Play boards
function solveBoardParClient(chosenCats) {
    const targetMask = (1 << chosenCats.length) - 1;
    const idxMap = {};
    chosenCats.forEach((cid, i) => { idxMap[cid] = i; });

    const hios = [];
    const partials = [];
    for (const m of DB.mammals) {
        let mask = 0;
        let popCount = 0;
        for (const t of m.traits) {
            if (idxMap[t] !== undefined) {
                mask |= (1 << idxMap[t]);
                popCount++;
            }
        }
        if (mask === targetMask) {
            hios.push({ name: m.name, views: m.views_60d || 10000 });
        } else if (popCount >= 2 && popCount <= 5) {
            partials.push({ mask, popCount, name: m.name, views: m.views_60d || 10000 });
        }
    }

    if (hios.length === 0 || hios.length > 4) return null;
    hios.sort((a, b) => b.views - a.views);
    partials.sort((a, b) => b.popCount - a.popCount || b.views - a.views);

    const top = partials.slice(0, 60);
    for (let i = 0; i < top.length; i++) {
        for (let j = i + 1; j < top.length; j++) {
            if ((top[i].mask | top[j].mask) === targetMask) {
                return {
                    par: 2,
                    hole_in_ones: hios.map(x => x.name),
                    sample_solution: [top[i].name, top[j].name]
                };
            }
        }
    }
    return null;
}

function startFreePlay() {
    const bioCats = DB.categories.filter(c => c.group !== "name" && catMap[c.id].count >= 5).map(c => c.id);
    const nameCats = DB.categories.filter(c => c.group === "name" && catMap[c.id].count >= 5).map(c => c.id);

    const shuffle = arr => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    };

    // Anchor around a random mammal's traits so we find a Hole-in-One board immediately!
    const shuffledMammals = shuffle(DB.mammals);
    for (const anchor of shuffledMammals) {
        const mBio = anchor.traits.filter(t => bioCats.includes(t));
        const mName = anchor.traits.filter(t => nameCats.includes(t));
        if (mBio.length < 5 || mName.length < 1) continue;

        for (let attempt = 0; attempt < 12; attempt++) {
            const chosen = [
                ...shuffle(mBio).slice(0, 5),
                shuffle(mName)[0]
            ];
            if (!areCategoriesOrthogonalClient(chosen)) continue;
            const solved = solveBoardParClient(chosen);
            if (solved) {
                isFreePlay = true;
                currentBoard = {
                    id: "FREE",
                    par: solved.par,
                    categories: shuffle(chosen),
                    hole_in_ones: solved.hole_in_ones,
                    sample_solution: solved.sample_solution
                };
                resetCurrentCourse();
                buildCoursePicker();
                return;
            }
        }
    }
}

function openPicker() {
    document.getElementById("picker-modal").classList.remove("hidden");
}
function closePicker() {
    document.getElementById("picker-modal").classList.add("hidden");
}

function openInspector(catId) {
    const cat = catMap[catId];
    if (!cat) return;
    document.getElementById("insp-title").textContent = `${cat.name} (${cat.count})`;
    document.getElementById("insp-desc").textContent = cat.desc;
    const chips = document.getElementById("insp-chips");
    chips.innerHTML = "";
    const guessedSet = new Set(strokes.map(s => s.mammal.name));
    for (const m of cat.mammals) {
        const sp = document.createElement("span");
        sp.className = "mammal-chip" + (guessedSet.has(m.name) ? " guessed" : "");
        sp.textContent = m.name;
        chips.appendChild(sp);
    }
    document.getElementById("inspector-modal").classList.remove("hidden");
}
function closeInspector() {
    document.getElementById("inspector-modal").classList.add("hidden");
}

document.getElementById("main-input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        submitMammal();
    }
});

// Boot: load embedded data immediately, and also attempt fetch in case JSON was updated
if (EMBEDDED_MAMMAL_DATA) {
    initDatabase(EMBEDDED_MAMMAL_DATA);
} else {
    fetch("mammal_golf.json")
        .then(r => r.json())
        .then(data => initDatabase(data))
        .catch(err => console.error("Failed to load mammal_golf.json:", err));
}
